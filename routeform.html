<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1622">
<meta name="description" content="ROUTEFORM 0.2 — preliminary Gråveggen (Vulkan Klatresenter) routesetting planner with mounting-hole model and phone field view.">
<title>ROUTEFORM — Gråveggen planner (preliminary)</title>
<style data-rf>
/* ROUTEFORM 0.2 — styles.css (desktop editor + phone field view) */
:root{color-scheme:dark;--bg:var(--g1);--panel:var(--g7);--panel2:var(--g12);--line:var(--g20);--txt:var(--g98);--muted:var(--g68);--accent:#e3a25f;--accent2:var(--accent-l30);--warn:#ffb35c;--bad:#ff7b72;--ok:#57c38b;--radius:12px;--fieldbar:56px}
/* Colour tokens (Amber defaults; src/js/theme.js recomputes them for the chosen colour scheme) */
:root{--accent-d6:#15181e;--accent-d25:#39312c;--accent-d87:#c38d57;--accent-d99:#e1a05e;--accent-l2:#e3a463;--accent-l30:#e9bc92;--accent-l56:#edd2bb;--accent-l61:#edd6c3;--bad-d16:#2d2027;--bad-d19:#33242a;--bad-d44:#6c3e40;--bad-d52:#804647;--bad-d54:#854849;--bad-d61:#97504f;--bad-d79:#c6635f;--bad-l47:#feb8b4;--bad-l54:#fdc0be;--bad-l82:#f7e1e5;--g0:#0b1019;--g0-a78:rgba(11,16,25,0.78);--g1:#0d121b;--g3:#10151f;--g4:#121720;--g4-a95:rgba(18,23,32,0.95);--g5-a82:rgba(20,25,34,0.82);--g5-a92:rgba(20,25,34,0.92);--g6:#161b24;--g7:#171d26;--g8:#191f28;--g9:#1b202a;--g10:#1d222c;--g10-a92:rgba(29,34,44,0.92);--g11:#1f242e;--g12:#212630;--g13:#232832;--g14:#252a34;--g15:#272c36;--g17:#2b303a;--g19:#2f343e;--g20:#313640;--g21:#333842;--g22:#353a44;--g23:#373c46;--g24:#393e48;--g25:#3b414b;--g27:#3f454f;--g28:#414751;--g29:#434953;--g32:#4a505a;--g33:#4c525c;--g37:#555b65;--g39:#595f69;--g40:#5c616b;--g61:#8d929c;--g68:#9ea4ad;--g71:#a6abb5;--g72:#a8aeb7;--g73:#abb0ba;--g75:#b0b5bf;--g77:#b5bac4;--g78:#b7bdc6;--g80:#bcc2cb;--g82:#c2c7d0;--g84:#c7ccd5;--g86:#ccd1db;--g88:#d1d6e0;--g89:#d4d9e2;--g90:#d6dce5;--g91:#d9dee7;--g92:#dce1ea;--g94:#e1e6ef;--g96:#e6ebf4;--g97:#e9eef7;--g98:#ecf1fa;--g100:#f1f6ff;--g100-a25:rgba(241,246,255,0.25);--g100-a40:rgba(241,246,255,0.4);--g100-a60:rgba(241,246,255,0.6);--g100-a70:rgba(241,246,255,0.7);--ok-d20:#192f2e;--ok-d22:#1b3230;--ok-d54:#336954;--ok-d55:#346b55;--ok-d63:#3a7a5f;--ok-l60:#b8e2d0;--ok-l76:#cfeae3;--warn-d15:#292525;--warn-d17:#2d2827;--warn-d19:#322b29;--warn-d20:#342d29;--warn-d39:#5f4a37;--warn-d48:#75593d;--warn-d61:#956e46;--warn-d94:#eea859;--warn-l40:#fbcfa3;--warn-l61:#f8ddc4}
*{box-sizing:border-box;touch-action:manipulation}  /* no double-tap page zoom on phones; the wall map has its own pinch zoom */
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;font-size:13px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--g84);margin:0 0 10px}
h3{font-size:12px;margin:12px 0 6px;color:var(--g92)}
p{margin:0 0 8px}
.muted,small{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.rf{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--g3);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark{width:30px;height:30px;border:2px solid var(--accent);border-radius:8px;transform:skewX(-5deg);position:relative;flex:0 0 30px}
.brandmark:before,.brandmark:after{content:"";position:absolute;width:6px;height:17px;border-left:3px solid var(--accent);transform:rotate(35deg);top:4px;left:9px}.brandmark:after{left:16px}
.brandname{font-weight:800;letter-spacing:.11em;font-size:14px}
.subbrand{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.pill{border:1px solid var(--g39);background:var(--g14);border-radius:100px;padding:2px 8px;font-size:10px;color:var(--g80);letter-spacing:.06em;font-weight:600}
.modes{display:flex;background:var(--g8);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.modes button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:12px;color:var(--g78)}
.modes button[aria-selected=true]{background:var(--g22);color:var(--g100);box-shadow:inset 0 0 0 1px var(--g40)}
.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--g29);background:var(--g17);color:var(--g97);border-radius:9px;min-height:34px;padding:6px 11px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--g25)}
.btn.primary{background:var(--accent-l2);color:var(--accent-d6);border-color:var(--accent-l2)}.btn.primary:hover{background:var(--accent2)}
.btn.subtle{background:transparent;border-color:transparent;color:var(--g77)}.btn.subtle:hover{background:var(--g14)}
.btn.danger{border-color:var(--bad-d54);color:var(--bad-l47)}
.btn.small{min-height:28px;padding:4px 8px;font-size:11px}
.btn.icon{min-width:34px;padding:6px}
.btn.on{border-color:var(--accent);background:var(--accent-d25);color:var(--accent-l56)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;background:var(--g15);border:1px solid var(--g28);color:var(--g86);font-size:11px;white-space:nowrap}
.chip.warn{background:var(--warn-d20);border-color:var(--warn-d48);color:var(--warn-l40)}
.chip.bad{background:var(--bad-d19);border-color:var(--bad-d52);color:var(--bad-l54)}
.chip.ok{background:var(--ok-d22);border-color:var(--ok-d55);color:var(--ok-l60)}
.conf{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:5px;color:#fff;white-space:nowrap}

/* calibration ribbon */
.ribbon{display:flex;align-items:center;gap:10px;padding:6px 14px;background:repeating-linear-gradient(135deg,var(--warn-d19) 0 14px,var(--warn-d15) 14px 28px);border-bottom:1px solid var(--warn-d48);color:var(--warn-l61);font-size:12px}
.ribbon b{color:var(--g100);letter-spacing:.05em}
.ribbon .grow{flex:1;min-width:0}
.ribbon.verified{background:var(--ok-d22);border-color:var(--ok-d55);color:var(--ok-l76)}

/* workspace */
.workspace{flex:1;display:grid;grid-template-columns:292px minmax(0,1fr) 336px;min-height:0}
.side{overflow-y:auto;padding:12px;background:var(--g3);min-height:0}
.side.left{border-right:1px solid var(--line)}.side.right{border-left:1px solid var(--line)}
.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.section>h2{border-bottom:1px solid var(--g22);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--g6)}
#wallCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.stage.placing #wallCanvas{cursor:crosshair}
.hud{position:absolute;display:flex;gap:6px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-tl{top:8px;left:44px;flex-wrap:wrap;max-width:calc(100% - 260px)}
.hud-tr{top:8px;right:8px}
.hud-bl{bottom:26px;left:44px;right:180px;font-size:11px;color:var(--g92);text-shadow:0 1px 2px var(--g0);pointer-events:none}
.prelim{background:var(--bad-d44);color:var(--bad-l82);border:1px solid var(--bad-d79);font-weight:800;font-size:10px;letter-spacing:.08em;padding:3px 7px;border-radius:5px}
.readout{background:var(--g0-a78);border:1px solid var(--g21);font-size:11px;padding:3px 7px;border-radius:5px;color:var(--g91);font-variant-numeric:tabular-nums}
.hud .btn{background:var(--g10-a92)}
.hud select{background:var(--g10-a92);border:1px solid var(--g29);border-radius:9px;min-height:34px;padding:4px 6px;font-size:12px}
.minimap{position:absolute;right:8px;bottom:26px;width:96px;height:132px;border:1px solid var(--g29);border-radius:7px;cursor:pointer;touch-action:none}
.climbbar{position:absolute;left:44px;right:116px;bottom:26px;margin:0 auto;max-width:780px;z-index:15;display:flex;flex-direction:column;gap:6px;background:var(--g4-a95);border:1px solid var(--g29);border-radius:12px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cb-row{display:flex;align-items:center;gap:8px;min-width:0}
.cb-row .sw{width:12px;height:12px;border-radius:50%;flex:none}
.cb-title{font-size:13px;white-space:nowrap}
.cb-move{flex:1;min-width:0;font-size:12px;color:var(--g91);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cb-play{min-width:92px}
.cb-scrub{flex:1;min-width:80px;accent-color:var(--accent)}
.cb-opts{flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cb-opts label{display:flex;align-items:center;gap:5px}
.cb-opts select{background:var(--g4);border:1px solid var(--g29);border-radius:8px;min-height:30px;padding:2px 6px;color:var(--txt);font-size:12px}
.cb-opts .chip{cursor:pointer;margin-left:auto}
.cb-note{margin:0;font-size:11px;color:var(--muted);line-height:1.35}
.htable{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.htable th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.htable td{padding:4px 6px;border-bottom:1px solid var(--g17)}
.htable tr.on td{background:var(--g14)}
.htable .warn-t{color:var(--warn)}
.stage.climbing #status{display:none}
/* phone: the player bar spans the bottom of the map; scrubber on its own line, options scroll sideways */
body.field .climbbar{left:6px;right:6px;bottom:6px;max-width:620px;padding:8px 10px 10px;gap:6px}
body.field .climbbar .cb-row:first-child{display:grid;grid-template-columns:12px minmax(0,1fr) 44px;column-gap:8px;row-gap:1px}
body.field .cb-row:first-child .sw{grid-area:1/1}
body.field .cb-title{grid-area:1/2;overflow:hidden;text-overflow:ellipsis;font-size:15px}
body.field .cb-move{grid-area:2/1/3/3;white-space:normal;font-size:13px;line-height:1.3}
body.field #cbClose{grid-area:1/3/3/4}
body.field .climbbar .btn{min-height:44px;min-width:44px}
body.field .climbbar .cb-row:nth-child(2){flex-wrap:wrap}
body.field .cb-play{flex:1}
body.field .cb-scrub{flex-basis:100%;height:26px;margin:0}
body.field .cb-opts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
body.field .cb-opts::-webkit-scrollbar{display:none}
body.field .cb-opts label{flex:none;font-size:13px;white-space:nowrap}
body.field .cb-opts select{min-height:44px}
body.field .cb-opts .chip{order:-1;flex:none;margin-left:0;min-height:44px}
body.field .stage.climbing .hud-tl,body.field .stage.climbing .minimap{display:none}
/* phone: the wall map gets the space; the ⚠ button in the top row carries the calibration warning */
body.field .hud-tl,body.field .minimap{display:none}
.popover{position:absolute;top:48px;right:8px;z-index:20;background:var(--g10);border:1px solid var(--g29);border-radius:10px;padding:10px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g90);padding:4px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:3px;min-width:0;margin-bottom:8px}
.field label,.lbl{font-size:11px;color:var(--g75);font-weight:700}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--g29);background:var(--g4);color:var(--g100);border-radius:8px;padding:6px 8px;min-height:32px;font-size:12px}
.field textarea{resize:vertical;min-height:64px}
.field input[type=checkbox],.field input[type=radio]{width:auto;min-height:0;padding:0;accent-color:var(--accent)}
.field input[type=color]{padding:2px;height:32px}
.field input[type=range]{padding:0;min-height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.hint{font-size:11px;line-height:1.5;color:var(--g72);margin:6px 0 0}
.callout{font-size:11px;background:var(--g17);border-left:3px solid var(--accent-d99);color:var(--g89);padding:8px 9px;border-radius:5px;margin:8px 0;line-height:1.5}
.callout.bad{border-left-color:var(--bad);background:var(--bad-d16)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-d20)}
.sep{height:1px;background:var(--g21);margin:10px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* routes & catalog */
.route-list{display:grid;gap:6px}
.routeitem{border:1px solid var(--g24);background:var(--g11);border-radius:9px;padding:6px 8px;display:flex;gap:8px;align-items:center;width:100%;text-align:left}
.routeitem.active{border-color:var(--g71);background:var(--g20)}
.routeitem .sw{width:14px;height:14px;border-radius:4px;flex:0 0 14px;border:1px solid var(--g100-a40)}
.routeitem .nm{flex:1;min-width:0}
.routeitem strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routeitem small{font-size:10px}
.eye{border:0;background:transparent;padding:4px 6px;border-radius:6px;color:var(--g82);font-size:14px}
.eye.off{opacity:.35}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.seg button{border:1px solid var(--g27);background:var(--g13);border-radius:7px;padding:5px 2px;font-size:11px;color:var(--g86)}
.seg button.on{border-color:var(--accent);background:var(--accent-d25);color:var(--accent-l56)}
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kit button{border:1px solid var(--g24);background:var(--g12);border-radius:9px;padding:5px 6px;display:flex;align-items:center;gap:7px;text-align:left;min-height:46px;font-size:11px;color:var(--g94)}
.kit button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--g15)}
.kit svg{flex:0 0 34px}
.toolrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.toolrow button{border:1px solid var(--g27);background:var(--g13);color:var(--g88);border-radius:9px;min-height:44px;font-size:11px;font-weight:600}
.toolrow button.on{border-color:var(--accent);background:var(--accent-d25);color:var(--accent-l56)}
.memb{display:flex;flex-wrap:wrap;gap:6px}
.memb label{display:flex;align-items:center;gap:5px;border:1px solid var(--g27);border-radius:7px;padding:4px 7px;font-size:11px;cursor:pointer}
.holdid{font-size:20px;font-weight:800;letter-spacing:.02em}
.review{background:var(--warn-d20);border:1px solid var(--warn-d48);color:var(--warn-l40);border-radius:8px;padding:8px;font-size:11px;margin:8px 0}
table.mini{width:100%;border-collapse:collapse;font-size:11px}
table.mini td,table.mini th{border-bottom:1px solid var(--g20);padding:4px 3px;text-align:left;vertical-align:top}
table.mini input{width:70px;border:1px solid var(--g29);background:var(--g4);border-radius:6px;padding:3px 5px;font-size:11px}
.photo-reg{position:relative;width:100%;aspect-ratio:4/3;background:var(--g0);border:1px solid var(--g29);border-radius:8px;overflow:hidden;touch-action:none}
.photo-reg canvas{width:100%;height:100%;display:block;cursor:crosshair}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.thumb{border:1px solid var(--g27);border-radius:8px;overflow:hidden;background:var(--g0);text-align:left;padding:0}
.thumb img{width:100%;height:76px;object-fit:cover;display:block}
.thumb span{display:block;padding:4px 6px;font-size:10px}
.thumb.on{border-color:var(--accent)}

/* menus, modals, toasts */
.menu{position:fixed;z-index:60;background:var(--g10);border:1px solid var(--g29);border-radius:10px;padding:5px;min-width:250px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-size:12px}
.menu button:hover{background:var(--g19)}
.menu hr{border:0;border-top:1px solid var(--g23);margin:4px 0}
.modal-back{position:fixed;inset:0;background:rgba(4,8,14,.66);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--g7);border:1px solid var(--g29);border-radius:14px;max-width:560px;width:100%;max-height:calc(100dvh - 28px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.wide{max-width:860px}
.modal header{padding:14px 16px 6px;font-weight:800;font-size:15px}
.modal .body{padding:6px 16px 10px;overflow-y:auto;font-size:13px}
.modal footer{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--g19)}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;pointer-events:none;width:min(520px,calc(100vw - 24px))}
.toast{background:var(--g14);border:1px solid var(--g33);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.warn{border-color:var(--warn-d61);background:var(--warn-d17)}.toast.bad{border-color:var(--bad-d61);background:var(--bad-d16)}.toast.ok{border-color:var(--ok-d63);background:var(--ok-d20)}
.qr{background:#fff;padding:10px;border-radius:8px;display:inline-block}
.qr svg{display:block;width:200px;height:200px}
.optcard{border:1px solid var(--g27);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--g10)}
.optcard h3{margin-top:0}

/* ---------------- phone / field view ---------------- */
.field-top,.field-tabs,.field-sheet,.field-page{display:none}
body.field .topbar,body.field .side,body.field .ribbon,body.field .hud-bl,body.field .hud-tl .readout{display:none}
body.field .workspace{grid-template-columns:minmax(0,1fr)}
body.field .field-top{display:block;background:var(--g3);border-bottom:1px solid var(--line);padding:6px 8px 6px;padding-top:max(6px,env(safe-area-inset-top))}
body.field .field-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--g3);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body.field .hud-tl{left:38px;top:auto;bottom:24px}
body.field .prelim{font-size:9px;padding:2px 5px;opacity:.92}
body.field .hud-tr{flex-direction:column;align-items:stretch;top:8px;right:6px;gap:6px}
body.field .hud-tr .btn{width:44px;height:44px;min-height:44px;padding:0;font-size:20px;background:var(--g5-a82)}
body.field .hud-tr [data-zoom=fit]{font-size:12px}
#fullBtn{display:none}
body.field #fullBtn{display:flex;align-items:center;justify-content:center}

      } else {
        const act = ui.activeRouteId, mine = pl.routeIds.includes(act);
        if (ui.display === 'solo' && !mine) return null;
        if (ui.display === 'focus' && !mine) alpha = 0.25;
        if (ui.display === 'occupancy') { color = '#9ca3ab'; rings = shown.map(r => r.color); }
        if (ui.mode === 'survey') alpha *= 0.55;
      }
      if (!routes.length) { color = '#9aa0a6'; alpha *= 0.8; }
      return { color, alpha, rings, multi: routes.length > 1, unassigned: !routes.length };
    }

    // ---- drawing ------------------------------------------------------------------
    draw() {
      const st = this.app.store, p = st.project, idx = st.index, ui = st.ui, ctx = this.ctx;
      if (!p || !idx) return;
      const v = this.v, s = v.s, field = ui.mode === 'field', survey = ui.mode === 'survey', L = ui.layers;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.fillStyle = TH.c(field ? 'g3' : 'g6');   // around the wall: follows the colour scheme
      ctx.fillRect(0, 0, this.w, this.h);
      const WH = p.wall.height.value, WW = p.wall.modelWidth.value;
      const vis = this.visibleWallRect();
      const [wx0, wy1] = this.toScreen(0, WH), [wx1, wy0] = this.toScreen(WW, 0);

      // Floor strip.
      ctx.fillStyle = '#20252c';
      ctx.fillRect(wx0 - 4000, wy0, (wx1 - wx0) + 8000, Math.max(0, this.h - wy0));
      // Wall surface: base colour under the panels, then paint regions clipped to panels.
      ctx.save();
      ctx.beginPath();
      for (const e of idx.panels.values()) this.polyPath(e.poly);
      ctx.clip();
      ctx.fillStyle = '#e3e1dc';
      ctx.fillRect(wx0, wy1, wx1 - wx0, wy0 - wy1);
      if (L.paint) for (const r of p.paint) { ctx.beginPath(); this.polyPath(r.polygon); ctx.fillStyle = r.color; ctx.fill(); }
      // Photo underlays (registered only), each with its own opacity.
      for (const ph of p.photos) {
        const previewing = this.app.regPreview?.photoId === ph.id;
        if (!L.photo && !previewing) continue;
        if (!(ph.registration || previewing) || (!ph.display.visible && !previewing)) continue;
        const warp = this.warpFor(ph);
        if (!warp) continue;
        const [sx, sy] = this.toScreen(warp.bb.minX, warp.bb.maxY);
        ctx.globalAlpha = ph.display.opacity;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(warp.canvas, sx, sy, warp.bb.w * s, warp.bb.h * s);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      // Panel seams / outlines.
      if (L.seams) {
        ctx.lineWidth = survey ? 1.2 : 1;
        ctx.strokeStyle = survey ? 'rgba(40,60,90,.55)' : 'rgba(70,70,70,.28)';
        ctx.beginPath();
        for (const e of idx.panels.values()) this.polyPath(e.poly);
        ctx.stroke();
      }
      if (survey || (L.labels && s > 0.12)) this.drawPanelLabels(idx, survey, s);

      // Holes (batched paths, viewport culled, level of detail by pitch).
      const occ = st.occupancy;
      if (L.holes) this.drawHoles(idx, occ, vis, survey || L.confidence, s);
      this.app.mode()?.drawUnder?.(ctx, this);

      // Sector boundary and outside dimming.
      const sx0 = p.sector.x0.value, sx1 = sx0 + p.sector.width.value;
      if (L.outside) {
        ctx.fillStyle = 'rgba(12,16,22,.42)';
        const [a] = this.toScreen(sx0, 0), [b] = this.toScreen(sx1, 0);
        if (a > wx0) ctx.fillRect(wx0, wy1, a - wx0, wy0 - wy1);
        if (b < wx1) ctx.fillRect(b, wy1, wx1 - b, wy0 - wy1);
      }

      // Holds.
      const routesById = new Map(p.routes.map(r => [r.id, r]));
      const catById = new Map(p.catalog.map(c => [c.id, c]));
      const drawList = [];
      for (const pl of p.placements) {
        const pos = W.placementPosition(idx, pl);
        const style = this.holdStyle(pl, routesById);
        if (!style) continue;
        const cat = catById.get(pl.catalogId) || { shape: 'jug', sizeMm: { w: 120, h: 90 } };
        if (!pos.ok) { if (pl.review && U.isNum(pl.review.prevX)) drawList.push({ pl, cat, style, x: pl.review.prevX, y: pl.review.prevY, rot: pl.rotation, detached: true }); continue; }
        const rad = Math.max(cat.sizeMm.w, cat.sizeMm.h) / 2 + 60;
        if (pos.x + rad < vis.x0 || pos.x - rad > vis.x1 || pos.y + rad < vis.y0 || pos.y - rad > vis.y1) continue;
        drawList.push({ pl, cat, style, x: pos.x, y: pos.y, rot: pl.rotation - pos.panelRotation, detached: false });
      }
      drawList.sort((a, b) => (b.cat.sizeMm.w * b.cat.sizeMm.h) - (a.cat.sizeMm.w * a.cat.sizeMm.h));
      const drag = this.app.dragState;
      for (const d of drawList) {
        if (drag && drag.placementId === d.pl.id) continue;
        this.drawHold(d.cat, d.x, d.y, d.rot, d.style, d.detached);
      }
      this.drawHoldBadges(drawList, s, field);

      // Facility fixtures: separate read-only layer drawn over holds like real ropes/draws.
      if (L.fixtures || L.ropes) this.drawFixtures(p, s, survey, L);
      // Animated climber (routesetting view only; a scripted illustration, see climber.js).
      this.app.climb?.draw(ctx, this);

      if (L.outside) {
        ctx.save();
        ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,214,140,.85)'; ctx.lineWidth = 1.5;
        for (const x of [sx0, sx1]) { const [a] = this.toScreen(x, 0); ctx.beginPath(); ctx.moveTo(a, wy1 - 18); ctx.lineTo(a, wy0 + 6); ctx.stroke(); }
        ctx.setLineDash([]);
        ctx.restore();
        const [la, ly] = this.toScreen(sx0, 0);
        ctx.font = '600 11px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,214,140,.95)'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
        if (this.app.store.ui.mode !== 'field') ctx.fillText(`SECTOR · ${(p.sector.width.value / 1000).toFixed(2)} m wide · ${RF.schema.CONF[p.sector.width.confidence].label.toUpperCase()}`, la + 4, ly + 8);
      }

      // Mode overlays (selection, hover targets, ghost grid, registration points...).
      this.app.mode()?.drawOver?.(ctx, this, drawList);
      if (drag && drag.ghost) this.drawHold(drag.ghost.cat, drag.ghost.x, drag.ghost.y, drag.ghost.rot, { color: drag.ghost.color, alpha: 0.75 }, false);

      this.drawRulers(p, s);
      this.app.onDrawn?.();
    }

    polyPath(poly) {
      poly.forEach((pt, i) => { const [x, y] = this.toScreen(pt[0], pt[1]); if (i) this.ctx.lineTo(x, y); else this.ctx.moveTo(x, y); });
      this.ctx.closePath();
    }

    drawPanelLabels(idx, survey, s) {
      const ctx = this.ctx, sel = this.app.store.ui.selection;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const e of idx.panels.values()) {
        const b = e.bb, [cx, cy] = this.toScreen((b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2);
        if (cx < -60 || cx > this.w + 60 || cy < -60 || cy > this.h + 60) continue;
        const big = Math.min(b.w, b.h) * s;
        if (big < 26) continue;
        const selected = sel?.kind === 'panel' && sel.id === e.panel.id;
        ctx.font = `${survey ? 700 : 600} ${U.clamp(big * 0.12, 10, 22)}px system-ui, sans-serif`;
        ctx.fillStyle = selected ? 'rgba(30,100,200,.9)' : survey ? 'rgba(30,50,80,.55)' : 'rgba(60,60,60,.22)';
        ctx.fillText(e.panel.label || e.panel.id, cx, cy);
        if (selected) {
          ctx.save(); ctx.strokeStyle = '#2b7bd6'; ctx.lineWidth = 3; ctx.beginPath(); this.polyPath(e.poly); ctx.stroke(); ctx.restore();
        }
      }
    }

    drawHoles(idx, occ, vis, confColors, s) {
      const ctx = this.ctx;
      const pitchPx = 200 * s;
      if (pitchPx < 3.2) return;
      const r = Math.max(0.85, 6.5 * s);
      const groups = new Map();
      const add = (key, h) => { if (!groups.has(key)) groups.set(key, []); groups.get(key).push(h); };
      for (const [pid, e] of idx.panels) {
        if (e.bb.maxX < vis.x0 || e.bb.minX > vis.x1 || e.bb.maxY < vis.y0 || e.bb.minY > vis.y1) continue;
        for (const h of idx.byPanel.get(pid)) {
          if (h.x < vis.x0 - 20 || h.x > vis.x1 + 20 || h.y < vis.y0 - 20 || h.y > vis.y1 + 20) continue;
          add(confColors ? h.confidence : 'plain', h);
        }
      }
      for (const [key, list] of groups) {
        ctx.beginPath();
        for (const h of list) { const [x, y] = this.toScreen(h.x, h.y); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
        ctx.fillStyle = 'rgba(38,40,44,.82)';
        ctx.fill();
        if (key !== 'plain' && r > 1.3) {
          ctx.lineWidth = Math.max(1, r * 0.45);
          ctx.strokeStyle = RF.schema.CONF[key]?.color || '#999';
          ctx.beginPath();
          for (const h of list) { const [x, y] = this.toScreen(h.x, h.y); ctx.moveTo(x + r * 1.7, y); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); }
          ctx.stroke();
        }
      }
      if (this.app.store.ui.mode === 'survey' && pitchPx > 9) {
        ctx.strokeStyle = '#d23c3c'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        const k = Math.max(3, r * 1.4);
        for (const h of idx.disabled.values()) {
          if (h.x < vis.x0 || h.x > vis.x1 || h.y < vis.y0 || h.y > vis.y1) continue;
          const [x, y] = this.toScreen(h.x, h.y);
          ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k);
        }
        ctx.stroke();
      }
      // Hole IDs at close zoom.
      if (pitchPx > 120 && this.app.store.ui.layers.labels) {
        ctx.font = '10px ui-monospace, Consolas, monospace'; ctx.fillStyle = 'rgba(30,40,60,.75)'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (const list of groups.values()) for (const h of list) { const [x, y] = this.toScreen(h.x, h.y); ctx.fillText(h.id, x, y + r + 3); }
      }
    }

    drawHold(cat, x, y, rotDeg, style, detached) {
      const ctx = this.ctx, s = this.v.s, shape = C.SHAPES[cat.shape] || C.SHAPES.jug, [kx, ky] = C.scaleFor(cat);
      const [sx, sy] = this.toScreen(x, y);
      const maxDim = Math.max(cat.sizeMm.w, cat.sizeMm.h) * s;
      ctx.save();
      ctx.globalAlpha = style.alpha ?? 1;
      if (maxDim < 4) {
        // Far zoom: hold reduced to a coloured dot that stays visible.
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(1.8, maxDim / 2), 0, Math.PI * 2);
        ctx.fillStyle = style.color; ctx.fill();
        ctx.restore();
        return;
      }
      ctx.translate(sx, sy);
      ctx.rotate(rotDeg * G.DEG);
      ctx.scale(s * kx, s * ky);
      const path = C.path2d(shape.d);
      if (detached) {
        ctx.setLineDash([6 / (s * kx), 5 / (s * kx)]);
        ctx.lineWidth = 2.5 / (s * Math.min(kx, ky)); ctx.strokeStyle = '#e03b3b'; ctx.stroke(path);
        ctx.restore();
        return;
      }
      // Soft contact shadow.
      ctx.save(); ctx.translate(5, 7); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill(path); ctx.restore();
      const b = shape.box, grad = ctx.createLinearGradient(b[0], b[1], b[2], b[3]);
      grad.addColorStop(0, U.shade(style.color, 0.28)); grad.addColorStop(0.55, style.color); grad.addColorStop(1, U.shade(style.color, -0.3));
      ctx.fillStyle = grad; ctx.fill(path);
      if (maxDim > 12) {
        for (const det of shape.details) {
          ctx.globalAlpha = (style.alpha ?? 1) * det.a;
          const c = det.tone === 'dark' ? U.shade(style.color, -0.55) : U.shade(style.color, 0.65);
          if (det.ellipse) { ctx.beginPath(); ctx.ellipse(det.ellipse[0], det.ellipse[1], det.ellipse[2], det.ellipse[3], 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
          else if (det.stroke) { ctx.lineWidth = det.stroke; ctx.lineCap = 'round'; ctx.strokeStyle = c; ctx.stroke(C.path2d(det.d)); }
          else { ctx.fillStyle = c; ctx.fill(C.path2d(det.d)); }
        }
        ctx.globalAlpha = style.alpha ?? 1;
      }
      ctx.lineWidth = 1.2 / (s * Math.min(kx, ky)); ctx.strokeStyle = U.shade(style.color, -0.5); ctx.stroke(path);
      ctx.restore();
      if (maxDim > 18) {
        // Bolt head at the true attachment point.
        ctx.save(); ctx.globalAlpha = style.alpha ?? 1;
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(1.6, 9 * s), 0, Math.PI * 2);
        ctx.fillStyle = '#2a2b2e'; ctx.fill(); ctx.lineWidth = Math.max(0.8, 3 * s); ctx.strokeStyle = '#c9cdd2'; ctx.stroke();
        ctx.restore();
      }
      if (style.rings && style.rings.length) {
        ctx.save();
        let rr = Math.max(8, maxDim / 2 + 4);
        for (const col of style.rings) { ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke(); rr += 4; }
        ctx.restore();
      }
    }

    drawHoldBadges(list, s, field) {
      const ctx = this.ctx, st = this.app.store, ui = st.ui, prog = st.progressItems();
      const showLabels = ui.layers.labels && s > 0.3 && ui.mode !== 'field';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const d of list) {
        const { pl, cat } = d;
        if (d.style.alpha < 0.3) continue;
        const [sx, sy] = this.toScreen(d.x, d.y), r = Math.max(cat.sizeMm.w, cat.sizeMm.h) / 2 * s;
        if (pl.marker && (s > 0.02)) {
          const txt = pl.marker === 'start' ? 'S' : 'F', col = pl.marker === 'start' ? '#1f6fd1' : '#0f8a5f';
          const bx = sx + r + 7, by = sy - r - 4, R = s > 0.08 ? 9 : 6.5;
          ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.font = `700 ${R > 8 ? 11 : 8}px system-ui, sans-serif`; ctx.fillStyle = '#fff'; ctx.fillText(txt, bx, by + 0.5);
        }
        if (pl.review && !field && s > 0.02) {
          ctx.save(); ctx.setLineDash([4, 3]); ctx.strokeStyle = '#ff8c1a'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(sx, sy, Math.max(9, r + 6), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
        const pr = prog && prog[pl.id];
        if (pr && pr.state !== 'pending' && (field || ui.layers.progress)) {
          const ok = pr.state === 'installed', bx = sx - r - 6, by = sy - r - 2;
          ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fillStyle = ok ? '#1f9d55' : '#d9480f'; ctx.fill();
          ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
          ctx.font = '700 10px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(ok ? '✓' : '!', bx, by + 0.5);
        }
        if (showLabels) {
          ctx.font = '600 10px system-ui, sans-serif';
          const t = pl.label, tw = ctx.measureText(t).width + 6, ty = sy + r + 9;
          ctx.fillStyle = 'rgba(20,24,30,.72)'; ctx.fillRect(sx - tw / 2, ty - 7, tw, 14);
          ctx.fillStyle = '#fff'; ctx.fillText(t, sx, ty);
        }
      }
    }

    drawFixtures(p, s, survey, L) {
      const ctx = this.ctx, WH = p.wall.height.value;
      const lines = p.fixtures.filter(f => f.kind === 'rope_line');
      if (L.ropes) lines.forEach((f, i) => {
        const [x, top] = this.toScreen(f.x, f.y), [, bottom] = this.toScreen(f.x, 0);
        ctx.save();
        ctx.strokeStyle = ROPE_COLORS[i % ROPE_COLORS.length]; ctx.globalAlpha = 0.8; ctx.lineWidth = Math.max(1, 10 * s);
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + 3 * s, bottom - 1100 * s); ctx.stroke();
        if (s > 0.02) {
          // Coiled tail hung near the base (as in photo P04): visual cue only.
          ctx.lineWidth = Math.max(0.8, 7 * s);
          for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x + (k - 1) * 30 * s, bottom - 900 * s, 160 * s, 330 * s, 0, 0, Math.PI * 2); ctx.stroke(); }
        }
        ctx.restore();
        if (L.labels) {
          ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillStyle = 'rgba(200,215,235,.9)';
          ctx.fillText(f.label, x, this.toScreen(0, WH)[1] - 4);
        }
      });
      if (!L.fixtures) return;
      const sel = this.app.store.ui.selection;
      for (const f of p.fixtures) {
        if (f.kind === 'rope_line') continue;
        const [x, y] = this.toScreen(f.x, f.y);
        if (x < -40 || x > this.w + 40 || y < -40 || y > this.h + 40) continue;
        ctx.save();
        if (f.kind === 'top_anchor') {
          const k = Math.max(5, 120 * s);
          ctx.strokeStyle = '#4c5056'; ctx.lineWidth = Math.max(2, 22 * s); ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x - k * 0.7, y - k * 0.8); ctx.lineTo(x, y); ctx.lineTo(x + k * 0.7, y - k * 0.8); ctx.moveTo(x, y); ctx.lineTo(x, y + k * 0.8); ctx.stroke();
        } else {
          const len = Math.max(6, 170 * s), wd = Math.max(1.6, 22 * s);
          ctx.fillStyle = '#9aa1a9'; ctx.beginPath(); ctx.arc(x, y, Math.max(1.8, 26 * s), 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#3a3f46'; ctx.fillRect(x - wd / 2, y, wd, len);
          if (s > 0.06) { ctx.strokeStyle = '#c4c9cf'; ctx.lineWidth = Math.max(1, 7 * s); ctx.beginPath(); ctx.ellipse(x, y + len + 30 * s, 22 * s, 42 * s, 0, 0, Math.PI * 2); ctx.stroke(); }
          // Quickdraw names when zoomed in: holds without a mounting hole are described from them ("near L3·5").
          if (L.labels && s > 0.15 && (this.app.store.ui.mode !== 'field' || !this.app.store.index.count)) {   // phone: only where there is no hole map
            ctx.font = '600 10px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            const tw = ctx.measureText(f.label).width + 6, ly = y + len * 0.4;
            ctx.fillStyle = 'rgba(20,24,30,.7)'; ctx.fillRect(x - wd - 4 - tw, ly - 7, tw, 14);
            ctx.fillStyle = '#e6edf5'; ctx.fillText(f.label, x - wd - 7, ly);
          }
        }
        if (survey && f.confidence !== 'field_verified') {
          ctx.setLineDash([3, 3]); ctx.strokeStyle = RF.schema.CONF[f.confidence]?.color || '#d64541'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, Math.max(8, 60 * s), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        }
        if (sel?.kind === 'fixture' && sel.id === f.id) {
          ctx.strokeStyle = '#2b7bd6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, Math.max(12, 90 * s), 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
    }

    drawRulers(p, s) {
      const ctx = this.ctx, WH = p.wall.height.value, x0 = p.sector.x0.value;
      const step = s > 0.25 ? 250 : s > 0.09 ? 500 : 1000;
      ctx.save();
      const bottom = this.app.store.ui.mode !== 'field';   // phone: height ruler only
      ctx.fillStyle = TH.c('g1-a78'); ctx.fillRect(0, 0, 34, this.h); if (bottom) ctx.fillRect(0, this.h - 20, this.w, 20);
      ctx.font = '10px system-ui, sans-serif'; ctx.fillStyle = TH.c('g80'); ctx.strokeStyle = TH.c('g52'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      const [, ytop] = this.toWall(0, 0), [, ybot] = this.toWall(0, this.h);
      for (let y = Math.max(0, Math.floor(ybot / step) * step); y <= Math.min(WH, ytop); y += step) {
        const [, sy] = this.toScreen(0, y);
        const major = y % 1000 === 0;
        ctx.beginPath(); ctx.moveTo(major ? 24 : 29, sy); ctx.lineTo(34, sy); ctx.stroke();
        if (major || step < 1000) ctx.fillText(major ? (y / 1000) + ' m' : (y / 1000).toFixed(step < 500 ? 2 : 1), 23, sy);
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (!bottom) { ctx.restore(); return; }
      const [xl] = this.toWall(34, 0), [xr] = this.toWall(this.w, 0), hstep = step * (s < 0.03 ? 2 : 1);
      for (let x = Math.ceil((xl - x0) / hstep) * hstep; x + x0 <= xr; x += hstep) {
        const [sx] = this.toScreen(x + x0, 0);
        ctx.beginPath(); ctx.moveTo(sx, this.h - 20); ctx.lineTo(sx, this.h - (x % 1000 === 0 ? 14 : 17)); ctx.stroke();
        if (x % 1000 === 0) ctx.fillText((x / 1000) + ' m', sx, this.h - 7);
      }
      ctx.restore();
    }

    // ---- photo warping (image -> wall via the stored homography) --------------------
    warpFor(ph) {
      const img = this.app.store.images.get(ph.id);
      const pv = this.app.regPreview?.photoId === ph.id ? this.app.regPreview : null;
      const reg = pv || ph.registration;
      if (!img || !reg) return null;
      const key = reg.H.join(',') + '|' + img.width;
      const hit = this.warpCache.get(ph.id);
      if (hit && hit.key === key) return hit;
      const H = reg.H, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!G.quadIsSane(H, w, h)) return null;
      const wallPts = [[0, 0], [w, 0], [w, h], [0, h]].map(q => G.applyH(H, q));
      const bb = G.bbox(wallPts);
      if (!(bb.w > 0 && bb.h > 0) || bb.w > 60000 || bb.h > 60000) return null;
      const res = Math.min(0.6, 2400 / Math.max(bb.w, bb.h));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.ceil(bb.w * res)); cv.height = Math.max(1, Math.ceil(bb.h * res));

  // ---- placement logic -------------------------------------------------------------------
  function colourOf(pl) { const st = ST(); return pl.color || st.route(pl.routeIds[0])?.color || '#9aa0a6'; }

  // Another hold within `mm` of a wall position (for holds placed by position, which share no hole).

      if (pos.ok && Math.hypot(pos.x - x, pos.y - y) < mm) return `${q.label} (${q.routeIds.map(r => st.route(r)?.name || '?').join(', ') || 'no route'})`;

  /* Resolve where a catalog item would attach for a pointer position. Screw-on holds, and bolt-on holds on

  function targetFor(cat, px, py, ignoreId, snapPx = SNAP_PX) {
    if (!cat) return null;
    const st = ST(), view = A().view, [wx, wy] = view.toWall(px, py);
    const under = W.panelAt(st.index, wx, wy), planned = cat.attachment === 'bolt_on' && !!under && !W.hasHoleMap(st.index, under.id);
    if (cat.attachment === 'screw_on' || planned) {
      const panel = under;

      return { ok: true, screw: true, planned, panel, local: { x: U.round(lx), y: U.round(ly) }, x: wx, y: wy, panelRotation: panel.transform.rotation || 0,
        blocked: planned ? crowdedBy(wx, wy, ignoreId) : null, ref: planned ? W.nearestReference(st.project, wx, wy) : null };
    }

  function drawTarget(ctx, view, t) {

      ctx.lineWidth = 3; ctx.strokeStyle = t.blocked ? '#ff4d4d' : '#38d27a';
      ctx.beginPath(); ctx.arc(x, y, Math.max(9, 22 * view.v.s), 0, Math.PI * 2); ctx.stroke();
      if (ST().ui.mode === 'field') { ctx.restore(); return; }   // phone: ring only, no text on the wall
      ctx.font = '700 11px ui-monospace, Consolas, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      const label = t.blocked ? `${t.hole.id} · occupied by ${t.blocked}` : t.hole.id;

        const tw = ctx.measureText(label).width + 10;

  // ---- right panel (inspector) -------------------------------------------------------------
  function renderRight() {

  function holdInspector(pl) {

    const mountHtml = m.ok ? `
      <div class="bighole" style="font-size:18px">${U.esc(m.code)}</div>

      ${cat ? `<p class="hint" style="margin-top:-4px">${UI.badge(cat.sizeConfidence)} ${cat.brand ? U.esc(cat.brand) + ' · ' : ''}${U.esc(cat.notes)}</p>` : '<div class="callout bad">Catalog item missing — drawn as a placeholder.</div>'}
      <div class="field"><label>Rotation (° clockwise from panel-up)</label><div class="row"><button class="btn small" data-rot="-15">↺ 15°</button><input class="inp" id="hRot" type="number" step="5" value="${pl.rotation}" style="width:74px"><button class="btn small" data-rot="15">↻ 15°</button>${UI.rotGlyph(pl.rotation)}<span class="muted">${U.clock(pl.rotation)}</span></div></div>

        ${pl.routeIds.length > 1 ? '<p class="hint">Shared hold: deliberately used by several routes.</p>' : ''}${!pl.routeIds.length ? '<p class="hint" style="color:var(--warn)">Not assigned to any route.</p>' : ''}</div>

  function routeInspector(r) {

      <div class="field"><label>Top anchor (reference)</label><select id="rAnchor"><option value="">—</option>${anchors.map(f => `<option value="${f.id}" ${f.id === r.anchorRef ? 'selected' : ''}>${U.esc(f.label)}</option>`).join('')}</select></div></div>

      <dl class="kv"><dt>Holds</dt><dd>${holds.length} (${holds.filter(h => h.role === 'feet').length} feet-only, ${holds.filter(h => h.routeIds.length > 1).length} shared)</dd>
      <dt>Height span</dt><dd>${ys.length ? (Math.min(...ys) / 1000).toFixed(1) + '–' + (Math.max(...ys) / 1000).toFixed(1) + ' m (estimated)' : '—'}</dd><dt>Markers</dt><dd>${starts} start · ${fins} finish</dd></dl>
      ${notes.map(n => `<div class="callout">${U.esc(n)}</div>`).join('')}
      <h3>Manual review prompts</h3>
      <p class="hint">Opening moves and first clips · clipping stances · rope line vs holds/volumes · finish & lowering · forerun with different body sizes. These are prompts for people; nothing here is checked automatically.</p>
      <h3>Recent history</h3><p class="hint">${(r.history || []).slice(-5).reverse().map(h => `${U.esc(h.at.slice(5, 16).replace('T', ' '))} ${U.esc(h.action)}`).join('<br>') || '—'}</p>
    </section>`;
  }
  function reviewQueue() {
    const st = ST(), flagged = st.project.placements.filter(pl => pl.review);
    if (!flagged.length) return '';
    return `<section class="section"><h2>Review queue <span class="chip warn">${flagged.length}</span></h2>
      <div class="list">${flagged.slice(0, 40).map(pl => `<button class="li" data-jump="${U.esc(pl.id)}" style="min-height:40px"><span class="sw" style="background:${pl.color || UI_routeColor(pl)}"></span><span class="main"><b style="font-size:12px">${U.esc(pl.label)}</b><span>${U.esc(pl.review.reason.slice(0, 90))}</span></span></button>`).join('')}</div>
      ${flagged.length > 1 ? '<div class="row" style="margin-top:8px"><button class="btn small" id="clearAllReview">Mark all reviewed…</button></div>' : ''}</section>`;
  }

  function wireRight(pl) {
    const st = ST(), app = A(), R = $('rightPanel'), q = sel => R.querySelector(sel);
    R.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => { const t = st.placement(b.dataset.jump); app.select({ kind: 'placement', id: t.id }); UI.zoomToPlacement(app, t); }));
    q('#clearAllReview')?.addEventListener('click', async () => {
      if (await app.confirm('Clear all review flags?', '<p>Confirm that you have reviewed every flagged hold position.</p>', 'Mark all reviewed')) st.commit('Clear review flags', p => p.placements.forEach(x => { x.review = null; }));
    });
    if (!pl) {
      const r = st.activeRoute();
      if (!r) return;
      q('#rClimb').addEventListener('click', () => (app.climb.active && app.climb.routeId === r.id ? app.climb.close() : app.climb.open(r.id)));
      const upd = (label, fn) => st.commit(label, p => { const x = p.routes.find(y => y.id === r.id); fn(x); x.history.push({ at: U.nowIso(), action: label }); });
      q('#rName').addEventListener('change', e => upd('Rename route', x => { x.name = e.target.value.trim().slice(0, 80) || 'Untitled route'; }));
      q('#rGrade').addEventListener('change', e => upd('Set grade', x => { x.grade = e.target.value.trim().slice(0, 20); }));
      q('#rScheme').addEventListener('change', e => upd('Set grade scheme', x => { x.gradeScheme = e.target.value.trim().slice(0, 40); }));
      q('#rColor').addEventListener('change', e => upd('Route colour', x => { x.color = e.target.value; }));
      q('#rStatus').addEventListener('change', e => upd('Status → ' + e.target.value, x => { x.status = e.target.value; }));
      q('#rLine').addEventListener('change', e => upd('Rope line reference', x => { x.lineRef = e.target.value || null; }));
      q('#rAnchor').addEventListener('change', e => upd('Anchor reference', x => { x.anchorRef = e.target.value || null; }));
      q('#rNotes').addEventListener('change', e => upd('Route notes', x => { x.notes = e.target.value.slice(0, 4000); }));
      return;
    }
    const upd = (label, fn) => st.commit(label + ' ' + pl.label, p => fn(p.placements.find(y => y.id === pl.id), p));
    q('#clearReview')?.addEventListener('click', () => upd('Reviewed', x => { x.review = null; }));
    q('#pickHole').addEventListener('click', () => { st.ui.tool = 'pick'; app.status('Click the wall where the hold should go (Esc cancels).'); app.renderPanels(); });
    q('#holeInput')?.addEventListener('change', e => {
      const id = e.target.value.trim(), h = st.index.holes.get(id);

      const blocked = holderOf(id, pl.id);
      if (blocked) { app.toast(`Hole ${id} is occupied by ${blocked}.`, 'warn'); return; }
      upd('Move', x => { x.holeId = id; x.panelId = null; x.local = null; });
      UI.zoomToPlacement(app, st.placement(pl.id));
    });
    q('#scPanel')?.addEventListener('change', e => upd('Move', x => { x.panelId = e.target.value; }));
    q('#scX')?.addEventListener('change', e => upd('Move', x => { x.local = { ...x.local, x: +e.target.value || 0 }; }));
    q('#scY')?.addEventListener('change', e => upd('Move', x => { x.local = { ...x.local, y: +e.target.value || 0 }; }));
    q('#hCat').addEventListener('change', e => upd('Change hold type', x => { x.catalogId = e.target.value; }));
    R.querySelectorAll('[data-rot]').forEach(b => b.addEventListener('click', () => rotate(pl, +b.dataset.rot)));
    q('#hRot').addEventListener('change', e => upd('Rotate', x => { x.rotation = U.normDeg(+e.target.value || 0); }));
    R.querySelectorAll('[data-memb]').forEach(b => b.addEventListener('change', async e => {
      const rid = b.dataset.memb;
      if (e.target.checked && pl.routeIds.length && !(await app.confirm('Share this hold?', `<p>${U.esc(pl.label)} will be used by <b>${U.esc(st.route(rid).name)}</b> as well as its current route(s). Shared holds appear in every route's plan and checklist.</p>`, 'Share hold'))) { renderRight(); return; }
      upd(e.target.checked ? 'Add to route' : 'Remove from route', x => { x.routeIds = e.target.checked ? [...new Set([...x.routeIds, rid])] : x.routeIds.filter(r => r !== rid); });
    }));
    q('#hRole').addEventListener('change', e => upd('Set use', x => { x.role = e.target.value; }));
    q('#hMark').addEventListener('change', e => upd('Set marker', x => { x.marker = e.target.value; }));
    q('#hColor').addEventListener('change', e => upd('Colour', x => { x.color = e.target.value; }));
    q('#hColorReset')?.addEventListener('click', () => upd('Colour', x => { x.color = null; }));
    q('#hNotes').addEventListener('change', e => upd('Notes', x => { x.notes = e.target.value.slice(0, 4000); }));
    q('#hZoom').addEventListener('click', () => UI.zoomToPlacement(app, pl));
    q('#hDup').addEventListener('click', () => duplicate(pl));
    q('#hDel').addEventListener('click', () => removeHold(pl));
  }

  // Shared with the phone view's Select / Place tools (ui-field.js).
  RF.routeEdit = { PALETTE, targetFor, drawTarget, placeNew, moveTo, rotate, nudge, duplicate, removeHold, logRoute, addRoute, duplicateRoute, deleteRoute };
})(globalThis.RF = globalThis.RF || {});

<script data-rf>
/* ROUTEFORM 0.2 — ui-survey.js
 * Wall survey / reconstruction mode: sector bounds, panel layout, per-panel hole-grid editor with
 * live preview, individual hole edits (add / move / disable / verify), facility-fixture records,
 * photo import and manual point-pair registration (planar homography).
 * Every geometry change runs through applyGeometry(): diff -> migration preview -> explicit choice. */
(function (RF) {
  'use strict';
  const U = RF.util, W = RF.wall, G = RF.geo, S = RF.schema, UI = RF.ui;
  const A = () => RF.app, ST = () => RF.app.store;
  const $ = id => document.getElementById(id);
  const confOpts = (sel, list = S.POINT_CONF) => list.map(c => `<option value="${c}" ${c === sel ? 'selected' : ''}>${S.CONF[c].label}</option>`).join('');
  const num = (v, d = 0) => (Number.isFinite(+v) && v !== '' ? +v : d);
  // The photo underlay layer starts hidden; showing or registering a photo switches it on.
  const showPhotoLayer = () => { const st = ST(); if (!st.ui.layers.photo) { st.ui.layers.photo = true; st.saveUi(); } };

  const mode = {
    gridPreview: null, reg: null, newHoleConf: 'photo_estimate',
    mount() { this.gridPreview = null; this.reg = null; A().regPreview = null; },
    unmount() { this.gridPreview = null; this.reg = null; A().regPreview = null; },
    renderPanels() { renderLeft(); renderRight(); $('stage').classList.toggle('placing', ST().ui.surveyTool !== 'select' || !!this.reg); },

    onHover(px, py) { UI.readout(ST(), A().view, px, py); },
    onTap(px, py) {
      const app = A(), st = ST(), view = app.view, tool = st.ui.surveyTool;
      if (this.reg) { regWallTap(px, py); return; }
      const [wx, wy] = view.toWall(px, py);
      if (tool === 'addHole') { addHoleAt(wx, wy); return; }
      if (tool === 'toggle') {
        const h = nearestAnyHole(wx, wy, 16 / view.v.s);
        if (h) toggleHole(h); else app.toast('No hole near that point.', 'warn');
        return;
      }
      if (st.ui.layers.fixtures) { const f = view.hitFixture(px, py); if (f) { app.select({ kind: 'fixture', id: f.id }); return; } }
      const h = nearestAnyHole(wx, wy, 12 / view.v.s);
      if (h) { app.select({ kind: 'hole', id: h.id }); return; }
      const panel = W.panelAt(st.index, wx, wy);
      app.select(panel ? { kind: 'panel', id: panel.id } : null);
    },
    drawUnder(ctx, view) {
      const gp = this.gridPreview;
      if (!gp) return;
      ctx.save();
      ctx.strokeStyle = '#19c3ff'; ctx.lineWidth = 1.6;
      const r = Math.max(2.5, 9 * view.v.s);
      for (const panel of gp.panels) {
        let pts;
        try { pts = W.gridPoints(panel); } catch (e) { continue; }
        ctx.beginPath();
        for (const q of pts) { const [x, y] = view.toScreen(...G.panelToWall(panel, [q.lx, q.ly])); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
        ctx.stroke();
      }
      ctx.restore();
    },
    drawOver(ctx, view) {
      const st = ST(), sel = st.ui.selection;
      if (sel?.kind === 'hole') {
        const h = st.index.holes.get(sel.id) || st.index.disabled.get(sel.id);
        if (h) {
          const [x, y] = view.toScreen(h.x, h.y);
          ctx.save(); ctx.strokeStyle = '#2b7bd6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, Math.max(10, 30 * view.v.s), 0, Math.PI * 2); ctx.stroke();
          ctx.font = '700 12px ui-monospace, Consolas, monospace'; ctx.fillStyle = 'rgba(10,14,20,.88)';
          const tw = ctx.measureText(h.id).width + 10; ctx.fillRect(x + 14, y - 26, tw, 18); ctx.fillStyle = '#9fd0ff'; ctx.textBaseline = 'middle'; ctx.fillText(h.id, x + 19, y - 17);
          ctx.restore();
        }
      }
      if (this.reg) {
        ctx.save();
        this.reg.pairs.forEach((pr, i) => {
          if (!pr.wall) return;
          const [x, y] = view.toScreen(pr.wall[0], pr.wall[1]);
          ctx.fillStyle = i === this.reg.active ? '#ffcc00' : '#ff8c1a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#000'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x, y + 0.5);
        });
        ctx.restore();
      }
    },
    onKey(e) {
      if (e.key === 'Escape') {
        if (this.reg) { cancelReg(); return; }
        ST().ui.surveyTool = 'select'; A().select(null);
      }
    },
    onPhoto() { if (this.reg) drawRegCanvas(); renderLeft(); }
  };

  function nearestAnyHole(x, y, maxD) {
    const st = ST(), n = W.nearestHole(st.index, x, y, { maxDist: maxD });
    let best = n ? n.hole : null, bd = n ? n.dist : maxD;
    for (const h of st.index.disabled.values()) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h; } }

  }

  /* Run a geometry mutation through diff + migration preview. Returns true when applied. */
  async function applyGeometry(label, mutate, target = '') {
    const st = ST(), app = A(), next = U.clone(st.project);

    for (const p of next.panels) { const err = G.validatePolygon(p.polygon); if (err) { app.toast(`Rejected: panel ${p.id} polygon ${err}.`, 'bad'); return false; } }
    let idx;
    try { idx = W.buildIndex(next); } catch (e) { app.toast('Rejected: ' + e.message, 'bad'); return false; }
    const diff = W.diffPlacements(st.project, next, st.index, idx);
    let strategy = 'none';
    if (diff.items.length) {
      const rows = diff.items.slice(0, 40).map(it => `<tr><td>${U.esc(it.label)}</td><td>${it.kind}</td><td class="mono">${U.esc(it.holeId || '—')}</td><td>${it.kind === 'shifted' ? Math.round(it.deltaMm) + ' mm' : U.esc(it.reason)}</td></tr>`).join('');
      const res = await app.modal({ title: 'This change affects placed holds', wide: true, html: `
        <p><b>${U.esc(label)}</b> moves or removes mounting holes that holds are attached to: <b>${diff.shifted}</b> hold(s) would shift (max ${Math.round(diff.maxShiftMm)} mm) and <b>${diff.detached}</b> would lose their hole.</p>
        <table class="mini"><tr><th>Hold</th><th>Effect</th><th>Hole ID</th><th>Detail</th></tr>${rows}</table>${diff.items.length > 40 ? `<p class="hint">…and ${diff.items.length - 40} more.</p>` : ''}
        <h3>How should placements follow?</h3>
        <label class="check"><input type="radio" name="mig" value="keep" checked> <span><b>Keep hole identity</b> (recommended when correcting a survey): holds stay on the same hole ID and move with it; holds whose hole disappears are marked detached.</span></label>
        <label class="check"><input type="radio" name="mig" value="reattach"> <span><b>Keep wall position</b>: re-attach each affected hold to the nearest free hole at its previous position.</span></label>
        <div class="callout">Either way, every affected hold is <b>flagged for review</b> — nothing is silently remapped. Undo restores the previous geometry.</div>`,
        buttons: [{ label: 'Cancel', value: null }, { label: 'Apply change', value: 'apply', kind: 'primary' }] });
      if (res.value !== 'apply') return false;
      strategy = res.el.querySelector('input[name=mig]:checked').value;
      W.applyMigration(next, diff, strategy, idx, label);
    }
    next.surveyLog.push({ at: U.nowIso(), kind: 'geometry', target, note: label + (diff.items.length ? ` — ${diff.shifted} shifted, ${diff.detached} detached; strategy: ${strategy}` : '') });
    st.replace(label, next);
    if (diff.items.length) app.toast(`${diff.items.length} hold(s) flagged for review.`, 'warn');
    return true;
  }
  RF.survey = { applyGeometry };

  function addHoleAt(x, y) {
    const st = ST(), app = A(), panel = W.panelAt(st.index, x, y);
    if (!panel) { app.toast('Click inside a panel to add a hole.', 'warn'); return; }
    const [lx, ly] = G.wallToPanel(panel, [x, y]), conf = mode.newHoleConf;
    let newId;
    applyGeometry(`Add hole on ${panel.id}`, p => {
      const q = p.panels.find(z => z.id === panel.id);
      newId = W.nextAddedHoleId(q);
      q.addedHoles.push({ id: newId, x: U.round(lx), y: U.round(ly), confidence: conf, source: 'Added manually in survey mode', verification: null });
    }, panel.id).then(ok => { if (ok) app.select({ kind: 'hole', id: newId }); });
  }
  function toggleHole(h) {
    applyGeometry(`${h.disabled ? 'Re-enable' : 'Mark unavailable'} hole ${h.id}`, p => {
      const q = p.panels.find(z => z.id === h.panelId);
      const o = q.holeOverrides[h.id] || {};
      if (h.disabled) delete o.disabled; else o.disabled = true;
      if (Object.keys(o).length) q.holeOverrides[h.id] = o; else delete q.holeOverrides[h.id];
    }, h.id).then(ok => { if (ok) A().select({ kind: 'hole', id: h.id }); });
  }

    $('addPhoto').addEventListener('click', importPhoto);
    $('addFixture').addEventListener('click', () => editFixture(null));
    $('layoutGen').addEventListener('click', layoutGenerator);
    $('measCsv').addEventListener('click', () => RF.exporters.exportMeasurementCsv());
    $('sectorFromView').addEventListener('click', () => {
      const vr = A().view.visibleWallRect();
      $('sxV').value = Math.round(Math.max(0, vr.x0 + 40 / A().view.v.s)); $('swV').value = Math.round(vr.x1 - vr.x0 - 220 / A().view.v.s);
    });
    $('applyWall').addEventListener('click', () => {
      const m = pre => ({ value: num($(pre + 'V').value, NaN), confidence: $(pre + 'C').value, source: $(pre + 'S').value.slice(0, 600) });
      const wh = m('wh'), sx = m('sx'), sw = m('sw');
      if (!(wh.value >= 1000 && wh.value <= 40000) || !(sw.value >= 500) || !Number.isFinite(sx.value)) { A().toast('Check the numbers: height 1–40 m, sector width ≥ 0.5 m.', 'warn'); return; }
      st.commit('Edit wall & sector', q => {
        q.wall.height = { ...q.wall.height, ...wh }; q.sector.x0 = { ...q.sector.x0, ...sx }; q.sector.width = { ...q.sector.width, ...sw };

      });
      A().view.fitSector();
    });
  }

  async function layoutGenerator() {
    const st = ST(), app = A(), L = st.project.layout || { cols: 9, colWidth: 1200, rowHeights: [2400], x0: 0, confidence: 'illustrative' };
    const res = await app.modal({ title: 'Panel layout generator', html: `
      <p>Re-tile the modelled wall with rectangular panels. Panel IDs are column letter + row number (A1 = bottom-left). Panels that keep their ID keep their hole pattern and overrides.</p>
      <div class="grid3"><div class="field"><label>Columns</label><input id="lgCols" type="number" min="1" max="60" value="${L.cols}"></div>
      <div class="field"><label>Column width (mm)</label><input id="lgW" type="number" min="200" max="6000" value="${L.colWidth}"></div>
      <div class="field"><label>Left offset (mm)</label><input id="lgX" type="number" value="${L.x0 || 0}"></div></div>
      <div class="field"><label>Row heights from the floor up (mm, comma separated)</label><input id="lgRows" value="${L.rowHeights.join(', ')}"></div>
      <div class="grid2"><div class="field"><label>Confidence of these dimensions</label><select id="lgConf">${confOpts(L.confidence)}</select></div>
      <div class="field"><label>Source / method</label><input id="lgSrc" placeholder="e.g. tape measure at base, 2026-11-10"></div></div>
      <div class="callout">Irregular or angled panels can be edited one by one afterwards (select a panel).</div>`,
      buttons: [{ label: 'Cancel', value: null }, { label: 'Generate…', value: 'ok', kind: 'primary' }] });
    if (res.value !== 'ok') return;
    const g = id => res.el.querySelector('#' + id).value;
    const cols = Math.round(num(g('lgCols'), 0)), colWidth = num(g('lgW'), 0), x0 = num(g('lgX'), 0);
    const rowHeights = g('lgRows').split(/[,;\s]+/).map(Number).filter(v => v >= 200 && v <= 10000);
    if (!(cols >= 1 && cols <= 60 && colWidth >= 200 && colWidth <= 6000 && rowHeights.length)) { app.toast('Check columns (1–60), width (200–6000 mm) and row heights.', 'warn'); return; }
    const conf = g('lgConf'), src = g('lgSrc') || 'Panel layout generator';
    applyGeometry(`Panel layout ${cols} × ${rowHeights.length}`, p => {
      p.panels = W.tilePanels(p, { cols, colWidth, rowHeights, x0, confidence: conf, source: src, defaultGrid: p.panels[0]?.grid || W.defaultGrid() });
      p.layout = { cols, colWidth, rowHeights, x0, confidence: conf };
      p.wall.modelWidth = { ...p.wall.modelWidth, value: x0 + cols * colWidth, confidence: conf, source: src };
    }, 'layout');
  }

      ${r ? `<dl class="kv"><dt>Pairs</dt><dd>${r.imagePoints.length}</dd><dt>Residual</dt><dd>RMS ${r.rms != null ? r.rms.toFixed(1) : '?'} mm · max ${r.maxErr != null ? r.maxErr.toFixed(1) : '?'} mm</dd><dt>Note</dt><dd>${U.esc(r.note)}</dd></dl>
        <p class="hint">A single homography is valid for one flat surface only.</p>` : '<p class="muted">Not registered: the photo is kept for reference but not drawn on the wall.</p>'}
      <div class="row"><button class="btn small primary" id="phReg" ${img ? '' : 'disabled'}>${r ? 'Edit registration…' : 'Register to wall…'}</button>${r ? '<button class="btn small" id="phUnreg">Remove registration</button>' : ''}<button class="btn small danger" id="phDel">Delete photo</button></div>
    </section>`;
  }

  function fixtureInspector(f) {
    if (!f) return '';
    return `<section class="section"><h2>Facility fixture ${UI.badge(f.confidence)}</h2>
      <div class="callout bad">Existing facility hardware — reference only. ROUTEFORM does not design, approve or authorise anchors or protection.</div>
      <dl class="kv"><dt>Kind</dt><dd>${U.esc(S.FIXTURE_KINDS[f.kind])}</dd><dt>Label</dt><dd>${U.esc(f.label)}</dd><dt>Line</dt><dd>${U.esc(f.lineId || '—')}</dd>
      <dt>Position</dt><dd>x ${Math.round(f.x)} mm, y ${Math.round(f.y)} mm</dd><dt>Source</dt><dd>${U.esc(f.source)}</dd>${f.verification ? `<dt>Verified</dt><dd>${U.esc(f.verification.method)} · ${U.esc(f.verification.date)} · ${U.esc(f.verification.by)}</dd>` : ''}<dt>Notes</dt><dd>${U.esc(f.notes || '—')}</dd></dl>
      <div class="row" style="margin-top:8px"><button class="btn small" id="fxEdit">Edit record…</button><button class="btn small danger" id="fxDel">Delete record</button></div></section>`;
