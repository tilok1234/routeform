  function wireRight() {
    const st = ST(), app = A(), sel = st.ui.selection, R = $('rightPanel'), q = s => R.querySelector(s);
    if (mode.reg) { wireReg(); return; }
    const toggleVer = (selId, verId) => { const s = q(selId), box = q(verId); if (!s || !box) return; const f = () => { box.style.display = s.value === 'field_verified' ? '' : 'none'; }; s.addEventListener('change', f); f(); };
    if (sel?.kind === 'panel') {
      const panel = st.project.panels.find(p => p.id === sel.id);
      toggleVer('#pConf', '#pvVer'); toggleVer('#gConf', '#gvVer');
      q('#pLabel').addEventListener('change', e => st.commit('Rename panel ' + panel.id, p => { p.panels.find(x => x.id === panel.id).label = e.target.value.slice(0, 60) || panel.id; }));
      q('#pNotes').addEventListener('change', e => st.commit('Panel notes', p => { p.panels.find(x => x.id === panel.id).notes = e.target.value.slice(0, 4000); }));
      ['#pW', '#pH'].forEach(id => q(id)?.addEventListener('change', () => {
        const w = num(q('#pW').value, 0), h = num(q('#pH').value, 0);
        q('#pPoly').value = `0,0; ${w},0; ${w},${h}; 0,${h}`;
      }));
      q('#pApply').addEventListener('click', () => {
        let poly;
        try {
          poly = q('#pPoly').value.split(';').map(s => s.trim()).filter(Boolean).map(s => s.split(',').map(Number));
          const err = G.validatePolygon(poly); if (err) throw new Error('polygon ' + err);
          if (G.polyArea(poly) < 0) poly.reverse();
        } catch (e) { app.toast('Outline rejected: ' + e.message, 'bad'); return; }
        const conf = q('#pConf').value;
        let ver;
        try { ver = readVerification('pv', conf); } catch (e) { app.toast(e.message, 'warn'); return; }
        const inc = q('#pInc').value === '' ? null : num(q('#pInc').value, null);
        applyGeometry(`Edit panel ${panel.id} outline`, p => {
          const x = p.panels.find(z => z.id === panel.id);
          x.polygon = poly; x.transform = { x: num(q('#pX').value), y: num(q('#pY').value), rotation: num(q('#pRot').value) };
          x.geometryConfidence = conf; x.geometrySource = q('#pSrc').value.slice(0, 600); x.geometryVerification = ver;
          x.pose3d = { ...x.pose3d, inclinationDeg: inc, confidence: q('#pIncC').value };
        }, panel.id);
      });
      const readGrid = () => ({ pattern: q('#gPat').value, pitchX: num(q('#gPX').value, 200), pitchY: num(q('#gPY').value, 200), rowOffset: num(q('#gOff').value, 0),
        originX: num(q('#gOX').value), originY: num(q('#gOY').value), rotation: num(q('#gRot').value), margin: num(q('#gMargin').value) });
      const preview = () => {
        const g = readGrid();
        if (!(g.pitchX >= 20 && g.pitchY >= 20)) { mode.gridPreview = null; app.requestDraw(); return; }
        const targets = q('#gAll').checked ? st.project.panels : [panel];
        mode.gridPreview = { panels: targets.map(t => ({ ...t, grid: { ...t.grid, ...g } })) };
        app.requestDraw();
      };
      R.querySelectorAll('#gPat,#gPX,#gPY,#gOff,#gOX,#gOY,#gRot,#gMargin,#gAll').forEach(el => el.addEventListener('input', preview));
      q('#gReset').addEventListener('click', () => { mode.gridPreview = null; renderRight(); app.requestDraw(); });
      q('#gApply').addEventListener('click', () => {
        const g = readGrid(), conf = q('#gConf').value, all = q('#gAll').checked;
        if (!(g.pitchX >= 20 && g.pitchX <= 3000 && g.pitchY >= 20 && g.pitchY <= 3000)) { app.toast('Pitch must be 20–3000 mm.', 'warn'); return; }
        let ver;
        try { ver = readVerification('gv', conf); } catch (e) { app.toast(e.message, 'warn'); return; }
        const src = q('#gSrc').value.slice(0, 600);
        applyGeometry(`Hole pattern ${g.pattern} ${g.pitchX}×${g.pitchY} on ${all ? 'all panels' : panel.id}`, p => {
          for (const x of p.panels) if (all || x.id === panel.id) x.grid = { ...x.grid, ...g, confidence: conf, source: src, verification: ver };
        }, all ? 'all panels' : panel.id).then(ok => { if (ok) { mode.gridPreview = null; app.requestDraw(); } });
      });
    } else if (sel?.kind === 'hole') {
      const h = st.index.holes.get(sel.id) || st.index.disabled.get(sel.id);
      toggleVer('#hConf', '#hvVer');
      q('#hApply').addEventListener('click', () => {
        const conf = q('#hConf').value, x = num(q('#hX').value, NaN), y = num(q('#hY').value, NaN);
        if (!Number.isFinite(x) || !Number.isFinite(y)) { app.toast('Enter numeric coordinates.', 'warn'); return; }
        let ver;
        try { ver = readVerification('hv', conf); } catch (e) { app.toast(e.message, 'warn'); return; }
        const src = q('#hSrc').value.slice(0, 600), movedNow = Math.abs(x - h.lx) > 0.05 || Math.abs(y - h.ly) > 0.05;
        applyGeometry(`Edit hole ${h.id}`, p => {
          const pan = p.panels.find(z => z.id === h.panelId);
          if (h.kind === 'added') Object.assign(pan.addedHoles.find(a => a.id === h.id), { x, y, confidence: conf, source: src, verification: ver });
          else {
            const o = pan.holeOverrides[h.id] || {};
            if (movedNow || h.moved) { o.x = x; o.y = y; }
            o.confidence = conf; o.source = src; o.verification = ver;
            pan.holeOverrides[h.id] = o;
          }
        }, h.id);
      });
      q('#hToggle').addEventListener('click', () => toggleHole(h));
      q('#hRemove')?.addEventListener('click', () => applyGeometry(`Remove hole ${h.id}`, p => {
        const pan = p.panels.find(z => z.id === h.panelId); pan.addedHoles = pan.addedHoles.filter(a => a.id !== h.id); delete pan.holeOverrides[h.id];
      }, h.id).then(ok => ok && app.select(null)));
      q('#hResetOv')?.addEventListener('click', () => applyGeometry(`Reset hole ${h.id} to grid`, p => {
        const pan = p.panels.find(z => z.id === h.panelId), o = pan.holeOverrides[h.id];
        if (o) { delete o.x; delete o.y; delete o.confidence; delete o.source; delete o.verification; if (!Object.keys(o).length) delete pan.holeOverrides[h.id]; }
      }, h.id));
    } else if (sel?.kind === 'photo') {
      const ph = st.project.photos.find(p => p.id === sel.id);
      const upd = (label, fn) => st.commit(label, p => fn(p.photos.find(x => x.id === ph.id)));
      q('#phSave').addEventListener('click', () => upd('Photo details', x => {
        x.name = q('#phName').value.slice(0, 120) || 'Photo'; x.dateTaken = q('#phDate').value.slice(0, 40); x.area = q('#phArea').value.slice(0, 400);
        x.showsOtherWalls = q('#phOther').checked; x.caveat = q('#phCav').value.slice(0, 1000);
      }));
      q('#phVis').addEventListener('change', e => {
        if (e.target.checked) showPhotoLayer();
        upd('Photo visibility', x => { x.display.visible = e.target.checked; });
      });
      q('#phOp').addEventListener('input', e => { ph.display.opacity = +e.target.value; app.requestDraw(); });
      q('#phOp').addEventListener('change', e => upd('Photo opacity', x => { x.display.opacity = +e.target.value; }));
      q('#phReg')?.addEventListener('click', () => startReg(ph));
      q('#phUnreg')?.addEventListener('click', () => upd('Remove photo registration', x => { x.registration = null; }));
      q('#phDel').addEventListener('click', async () => {
        if (await app.confirm('Delete photo?', `<p>Remove "${U.esc(ph.name)}" from the project? (Undo is available.)</p>`, 'Delete', 'danger')) { st.commit('Delete photo', p => { p.photos = p.photos.filter(x => x.id !== ph.id); }); app.select(null); }
      });
    } else if (sel?.kind === 'fixture') {
      const f = st.project.fixtures.find(x => x.id === sel.id);
      q('#fxEdit').addEventListener('click', () => editFixture(f));
      q('#fxDel').addEventListener('click', async () => {
        if (await app.confirm('Delete fixture record?', `<p>Delete the record of ${U.esc(f.label)}? This only edits the reference layer.</p>`, 'Delete record', 'danger')) { st.commit('Delete fixture record', p => { p.fixtures = p.fixtures.filter(x => x.id !== f.id); }); app.select(null); }
      });
    }
  }

  async function editFixture(f) {
    const st = ST(), app = A(), isNew = !f;
    f = f || { id: U.uid('fx'), kind: 'protection_point', label: '', lineId: '', x: Math.round(st.project.sector.x0.value + 1000), y: 3000, confidence: 'photo_estimate', source: '', verification: null, notes: '' };
    const lines = st.project.fixtures.filter(x => x.kind === 'rope_line');
    const res = await app.modal({ title: isNew ? 'Record an existing facility fixture' : 'Edit fixture record', html: `
      <div class="callout bad">You are recording the position of <b>existing</b> facility hardware for orientation. This does not design, approve or authorise anchors or protection. Enter positions from surveys, building drawings or careful observation and mark the confidence honestly.</div>
      <div class="grid2"><div class="field"><label>Kind</label><select id="fKind">${Object.entries(S.FIXTURE_KINDS).map(([k, t]) => `<option value="${k}" ${k === f.kind ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Label</label><input id="fLabel" value="${U.esc(f.label)}"></div></div>
      <div class="grid3"><div class="field"><label>X (mm)</label><input id="fX" type="number" value="${Math.round(f.x)}"></div><div class="field"><label>Y (mm)</label><input id="fY" type="number" value="${Math.round(f.y)}"></div>
      <div class="field"><label>Rope line</label><select id="fLine"><option value="">—</option>${lines.map(l => `<option value="${l.id}" ${l.id === f.lineId ? 'selected' : ''}>${U.esc(l.label)}</option>`).join('')}</select></div></div>
      <div class="grid2"><div class="field"><label>Confidence</label><select id="fConf">${confOpts(f.confidence)}</select></div><div class="field"><label>Source</label><input id="fSrc" value="${U.esc(f.source)}"></div></div>
      ${verificationFields('fv', f.verification)}
      <div class="field"><label>Notes</label><input id="fNotes" value="${U.esc(f.notes)}"></div>`,
      buttons: [{ label: 'Cancel', value: null }, { label: isNew ? 'Add record' : 'Save record', value: 'ok', kind: 'primary' }] });
    if (res.value !== 'ok') return;
    const g = id => res.el.querySelector('#' + id).value;
    const x = num(g('fX'), NaN), y = num(g('fY'), NaN);
    if (!Number.isFinite(x) || !Number.isFinite(y)) { app.toast('Fixture needs numeric coordinates.', 'warn'); return; }
    let ver = null;
    if (g('fConf') === 'field_verified') {
      ver = { method: g('fvMethod'), date: g('fvDate'), by: g('fvBy'), note: g('fvNote') };
      if (!ver.method || !ver.date) { app.toast('Field-verified needs a method and a date.', 'warn'); return; }
    }
    const rec = { ...f, kind: g('fKind'), label: g('fLabel').slice(0, 60) || 'Fixture', x, y, lineId: g('fLine') || (f.kind === 'rope_line' ? f.id : ''), confidence: g('fConf'), source: g('fSrc').slice(0, 600), verification: ver, notes: g('fNotes').slice(0, 1000) };
    st.commit(isNew ? 'Record fixture' : 'Edit fixture record', p => {
      if (isNew) p.fixtures.push(rec); else Object.assign(p.fixtures.find(z => z.id === f.id), rec);
      p.surveyLog.push({ at: U.nowIso(), kind: 'fixture', target: rec.id, note: `${isNew ? 'Recorded' : 'Edited'} fixture ${rec.label} (${rec.confidence})` });
    });
    app.select({ kind: 'fixture', id: rec.id });
  }

  // ---- photo import ---------------------------------------------------------------------------
  async function importPhoto() {
    const st = ST(), app = A(), f = await app.pickFile('image/png,image/jpeg,image/webp');
    if (!f) return;
    if (f.size > 40e6) { app.toast('Image larger than 40 MB.', 'bad'); return; }
    let dataUrl = await U.readFile(f, 'dataURL'), img;
    try { img = await U.loadImage(dataUrl); } catch (e) { app.toast('That file could not be decoded as an image.', 'bad'); return; }
    let w = img.naturalWidth, h = img.naturalHeight, note = '';
    if (Math.max(w, h) > 2400) {
      const k = 2400 / Math.max(w, h), c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      dataUrl = c.toDataURL('image/jpeg', 0.86); w = c.width; h = c.height;
      note = ` Stored as a ${w}×${h} copy (original ${img.naturalWidth}×${img.naturalHeight}).`;
    }
    const id = U.uid('photo');
    st.photoData.set(id, dataUrl);
    st.commit('Import photo', p => p.photos.push({ id, name: f.name.replace(/\.[^.]+$/, '').slice(0, 120), fileName: f.name, mime: dataUrl.slice(5, dataUrl.indexOf(';')), width: w, height: h,
      dateTaken: '', area: '', showsOtherWalls: false, notes: 'Imported ' + U.nowIso().slice(0, 10) + '.' + note, caveat: 'Unregistered photo: no measurements derived.', dataUrl: null, dataRef: id,
      dataHash: U.hash(dataUrl.slice(0, 4000) + dataUrl.length), registration: null, display: { opacity: 0.6, visible: true } }));
    st.decodePhotos();
    app.select({ kind: 'photo', id });
    app.toast('Photo imported. Register it to overlay it on one flat area of the wall.' + note, 'ok');
  }

  // ---- registration (manual point pairs) ------------------------------------------------------
  function startReg(ph) {
    const r = ph.registration;
    mode.reg = { photoId: ph.id, pairs: r ? r.imagePoints.map((im, i) => ({ img: im.slice(), wall: r.wallPoints[i].slice(), src: 'saved' })) : [], active: 0, next: 'img',
      conf: r?.confidence || 'photo_estimate', note: r?.note || '', sol: null, view: null };
    if (!mode.reg.pairs.length) mode.reg.pairs.push({ img: null, wall: null });
    mode.reg.active = mode.reg.pairs.length - 1;
    mode.reg.next = mode.reg.pairs[mode.reg.active].img ? 'wall' : 'img';
    if (r) solveReg(false);
    A().renderPanels();
  }
  function cancelReg() { mode.reg = null; A().regPreview = null; A().renderPanels(); A().requestDraw(); }
  function regWallTap(px, py) {
    const reg = mode.reg, app = A(), st = ST(), view = app.view, pr = reg.pairs[reg.active];
    if (!pr) return;
    let [x, y] = view.toWall(px, py), src = 'clicked';
    const maxD = 14 / view.v.s;
    let bd = maxD;
    for (const e of st.index.panels.values()) for (const c of e.poly) { const d = Math.hypot(c[0] - x, c[1] - y); if (d < bd) { bd = d; x = c[0]; y = c[1]; src = 'panel corner ' + e.panel.id; } }
    if (src === 'clicked') { const n = W.nearestHole(st.index, x, y, { maxDist: maxD }); if (n) { x = n.hole.x; y = n.hole.y; src = 'hole ' + n.hole.id; } }
    pr.wall = [U.round(x, 1), U.round(y, 1)]; pr.src = src;
    advanceReg();
  }
  function advanceReg() {
    const reg = mode.reg, pr = reg.pairs[reg.active];
    if (pr.img && pr.wall) { reg.pairs.push({ img: null, wall: null }); reg.active = reg.pairs.length - 1; reg.next = 'img'; }
    else reg.next = pr.img ? 'wall' : 'img';
    solveReg(true);
    renderRight(); A().requestDraw();
  }
  function completePairs() { return mode.reg.pairs.filter(p => p.img && p.wall); }
  function solveReg(preview) {
    const reg = mode.reg, pairs = completePairs(), ph = ST().project.photos.find(p => p.id === reg.photoId);
    reg.sol = pairs.length >= 4 ? G.computeHomography(pairs.map(p => p.img), pairs.map(p => p.wall)) : null;
    if (reg.sol?.ok && ph && !G.quadIsSane(reg.sol.H, ph.width, ph.height)) reg.sol = { ok: false, error: 'The photo would fold or flip on the wall — check that point pairs correspond.' };
    A().regPreview = reg.sol?.ok && preview !== false ? { photoId: reg.photoId, H: reg.sol.H } : null;
    A().view.warpCache.delete(reg.photoId);
  }
  function regPanel() {
    const reg = mode.reg, st = ST(), ph = st.project.photos.find(p => p.id === reg.photoId), sol = reg.sol;
    const rows = reg.pairs.map((p, i) => `<tr class="${i === reg.active ? 'on' : ''}"><td><button class="btn small ${i === reg.active ? 'on' : ''}" data-act="${i}">${i + 1}</button></td>
      <td class="mono">${p.img ? p.img.map(v => Math.round(v)).join(', ') : '—'}</td>
      <td><input data-wx="${i}" type="number" value="${p.wall ? p.wall[0] : ''}" placeholder="x"></td><td><input data-wy="${i}" type="number" value="${p.wall ? p.wall[1] : ''}" placeholder="y"></td>
      <td>${sol?.ok && p.img && p.wall ? Math.round(sol.residuals[completePairs().indexOf(p)]) : ''}</td><td><button class="btn small subtle" data-del="${i}" aria-label="Delete pair">✕</button></td></tr>`).join('');
    return `<section class="section"><h2>Register: ${U.esc(ph?.name || '')}</h2>
      <div class="callout">${reg.next === 'img' ? `<b>Step:</b> click point <b>${reg.active + 1}</b> on the <b>photo</b> below.` : `<b>Step:</b> click the <b>same point ${reg.active + 1}</b> on the <b>wall</b> (snaps to panel corners/holes), or type its coordinates.`}
      Use ≥4 pairs on <b>one flat surface</b>; a 5th+ pair lets the residual reveal mistakes.</div>
      <div class="photo-reg"><canvas id="regCanvas"></canvas></div>
      <p class="hint">Wheel = zoom, drag = pan, click = place point.</p>
      <table class="mini"><tr><th>#</th><th>Photo px</th><th>Wall X</th><th>Wall Y</th><th>Err mm</th><th></th></tr>${rows}</table>
      ${sol ? (sol.ok ? `<div class="callout ${sol.maxErr > 30 ? '' : 'ok'}">Fit: RMS ${sol.rms.toFixed(1)} mm, max ${sol.maxErr.toFixed(1)} mm over ${completePairs().length} pairs.${sol.warnings.map(w => '<br>' + U.esc(w)).join('')}</div>` : `<div class="callout bad">${U.esc(sol.error)}</div>`) : `<p class="hint">${completePairs().length}/4 complete pairs.</p>`}
      <div class="grid2"><div class="field"><label>Confidence</label><select id="regConf">${confOpts(reg.conf, ['illustrative', 'photo_estimate', 'calibrated'])}</select></div><div class="field"><label>Note</label><input id="regNote" value="${U.esc(reg.note)}" placeholder="which points / measured how"></div></div>
      <p class="hint">Use <i>calibrated</i> only when the wall coordinates come from real measurements. Registration never alters panels or holes.</p>
      <div class="row end"><button class="btn small" id="regCancel">Cancel</button><button class="btn small primary" id="regSave" ${sol?.ok ? '' : 'disabled'}>Save registration</button></div></section>`;
  }
  function wireReg() {
    const reg = mode.reg, st = ST(), app = A(), R = $('rightPanel');
    R.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { reg.active = +b.dataset.act; const p = reg.pairs[reg.active]; reg.next = p.img ? 'wall' : 'img'; renderRight(); app.requestDraw(); }));
    R.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      reg.pairs.splice(+b.dataset.del, 1);
      if (!reg.pairs.length || reg.pairs[reg.pairs.length - 1].img) reg.pairs.push({ img: null, wall: null });
      reg.active = Math.min(reg.active, reg.pairs.length - 1); reg.next = reg.pairs[reg.active].img ? 'wall' : 'img';
      solveReg(true); renderRight(); app.requestDraw();
    }));
    const wallInput = (i, k, v) => { const p = reg.pairs[i]; p.wall = p.wall || [0, 0]; p.wall[k] = num(v, 0); p.src = 'typed'; reg.active = i; if (p.img) advanceReg(); else { solveReg(true); renderRight(); } };
    R.querySelectorAll('[data-wx]').forEach(inp => inp.addEventListener('change', e => wallInput(+inp.dataset.wx, 0, e.target.value)));
    R.querySelectorAll('[data-wy]').forEach(inp => inp.addEventListener('change', e => wallInput(+inp.dataset.wy, 1, e.target.value)));
    $('regConf').addEventListener('change', e => { reg.conf = e.target.value; });
    $('regNote').addEventListener('change', e => { reg.note = e.target.value.slice(0, 1000); });
    $('regCancel').addEventListener('click', cancelReg);
    $('regSave').addEventListener('click', () => {
      const pairs = completePairs(), sol = reg.sol;
      if (!sol?.ok) return;
      st.commit('Register photo', p => {
        const ph = p.photos.find(x => x.id === reg.photoId);
        ph.registration = { H: sol.H, imagePoints: pairs.map(x => x.img), wallPoints: pairs.map(x => x.wall), rms: sol.rms, maxErr: sol.maxErr, confidence: reg.conf,
          note: reg.note || `Manual registration with ${pairs.length} pairs (${pairs.map(x => x.src || 'typed').join('; ')})`, at: U.nowIso(), planarOnly: true };
        ph.display.visible = true;
        p.surveyLog.push({ at: U.nowIso(), kind: 'photo', target: ph.id, note: `Registered ${ph.name}: ${pairs.length} pairs, RMS ${sol.rms.toFixed(1)} mm (${reg.conf})` });
      });
      const id = reg.photoId;
      showPhotoLayer();
      mode.reg = null; app.regPreview = null; app.view.warpCache.delete(id);
      app.select({ kind: 'photo', id });
    });
    setupRegCanvas();
  }
  function setupRegCanvas() {
    const cv = $('regCanvas'), reg = mode.reg, img = ST().images.get(reg.photoId);
    if (!cv) return;
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);

        <div class="statusbtns" role="group" aria-label="Checklist status">${Object.entries(STATES).map(([k, v]) => `<button data-s="${k}" class="${prog.state === k ? 'on' : ''}" aria-pressed="${prog.state === k}">${v.icon} ${v.label}</button>`).join('')}</div>
        <div class="field"><label for="shNote">On-wall note / deviation</label><input id="shNote" value="${U.esc(prog.note || '')}" placeholder="e.g. used hole one to the right" style="min-height:44px;font-size:16px"></div>

      if (!cur) return;

    }));
    el.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => st.setProgress(pl.id, b.dataset.s)));
    // One button steps through the checklist states: Pending → Installed → Needs fix → Pending.
    el.querySelector('#shState').addEventListener('click', () => { const k = Object.keys(STATES); st.setProgress(pl.id, k[(k.indexOf(prog.state) + 1) % k.length]); });

  // Place tool: which route, which hold, which rotation; then tap holes on the wall.

    const kit = p.catalog.map(c => `<button data-cat="${U.esc(c.id)}" class="${c.id === ui.catalogId ? 'on' : ''}" aria-pressed="${c.id === ui.catalogId}">${C.svgFor(c, route?.color || '#c9a06a', 30)}<span>${U.esc(c.name)}</span></button>`).join('');

    el.innerHTML = `<div class="sheet-grab"></div>
      ${route ? `<div class="pb-row"><span class="sw" style="background:${route.color}"></span>
        <select id="pbRoute" aria-label="Route the new holds go to">${p.routes.map(r => `<option value="${U.esc(r.id)}" ${r.id === route.id ? 'selected' : ''}>${U.esc(r.name)} · ${st.holdsOf(r.id).length}</option>`).join('')}<option value="__edit">✎ Edit this route…</option><option value="__new">＋ New route…</option></select>
        <button class="btn icon" data-prot="-15" aria-label="Turn new holds 15° anticlockwise">↺</button>
        <span class="pb-deg" aria-label="New holds turned ${ui.placeRotation}°">${ui.placeRotation}°</span>

  async function routeDialog(route, isNew) {
    const st = ST(), app = A();
    if (!route) return;
    const res = await app.modal({ title: isNew ? 'New route' : 'Edit route', html: `
      <div class="field"><label for="rdName">Name</label><input id="rdName" maxlength="80" value="${U.esc(route.name)}" autocomplete="off"></div>
      <div class="grid2"><div class="field"><label for="rdGrade">Intended grade</label><input id="rdGrade" maxlength="20" value="${U.esc(route.grade)}" autocomplete="off"></div>
      <div class="field"><label for="rdStatus">Status</label><select id="rdStatus">${S.ROUTE_STATUS.map(s => `<option ${s === route.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
      <div class="field"><label>Colour</label><div class="swatches">${RE().PALETTE.map(c => `<button type="button" data-col="${c}" class="${c === route.color ? 'on' : ''}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}<input type="color" id="rdColor" value="${route.color}" aria-label="Other colour"></div></div>
      <div class="field"><label for="rdNotes">Setter notes / intended movement</label><textarea id="rdNotes" maxlength="4000">${U.esc(route.notes)}</textarea></div>
      ${isNew ? '' : '<div class="row"><button type="button" class="btn" id="rdDup">Duplicate…</button><button type="button" class="btn danger" id="rdDel">Delete route…</button></div>'}`,
      buttons: [{ label: isNew ? 'Skip' : 'Cancel', value: null }, { label: 'Save', value: 'ok', kind: 'primary' }],
      onOpen: (box, done) => {
        box.querySelectorAll('[data-col]').forEach(b => b.addEventListener('click', () => {
          box.querySelector('#rdColor').value = b.dataset.col;
          box.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x === b));
        }));
        box.querySelector('#rdDup')?.addEventListener('click', () => done('dup'));
        box.querySelector('#rdDel')?.addEventListener('click', () => done('del'));
      } });
    if (res.value === 'dup') return RE().duplicateRoute(route);
    if (res.value === 'del') return RE().deleteRoute(route);
    if (res.value !== 'ok') return;
    const g = id => res.el.querySelector('#' + id).value;
    const next = { name: g('rdName').trim().slice(0, 80) || 'Untitled route', grade: g('rdGrade').trim().slice(0, 20), status: g('rdStatus'), color: g('rdColor'), notes: g('rdNotes').slice(0, 4000) };
    const cur = st.route(route.id);
    if (!cur || Object.keys(next).every(k => next[k] === cur[k])) return;
    st.commit('Edit route ' + next.name, p => {
      Object.assign(p.routes.find(x => x.id === route.id), next);
      RE().logRoute(p, route.id, 'Edited on the phone');
    });
  }

  async function holdDialog(pl) {
    const st = ST(), app = A(), p = st.project;
    const opt = (list, sel) => list.map(([v, t]) => `<option value="${U.esc(v)}" ${v === sel ? 'selected' : ''}>${U.esc(t)}</option>`).join('');
    const res = await app.modal({ title: 'Edit ' + pl.label, html: `
      <div class="field"><label for="hdCat">Hold</label><select id="hdCat">${opt(p.catalog.filter(c => c.attachment === pl.attachment).map(c => [c.id, `${c.name} — ${c.sizeMm.w}×${c.sizeMm.h} mm`]), pl.catalogId)}</select></div>
      <div class="grid2"><div class="field"><label for="hdRole">Use</label><select id="hdRole">${opt([['both', 'Hands + feet'], ['hands', 'Hands'], ['feet', 'Feet only']], pl.role)}</select></div>
      <div class="field"><label for="hdMark">Marker</label><select id="hdMark">${opt([['', 'None'], ['start', 'Start'], ['finish', 'Finish']], pl.marker)}</select></div></div>
      <div class="field"><label for="hdRot">Rotation (° clockwise from panel-up)</label><input id="hdRot" type="number" inputmode="numeric" step="5" value="${pl.rotation}"></div>
      <div class="field"><label>Routes</label><div class="memb">${p.routes.map(r => `<label><input type="checkbox" data-memb="${U.esc(r.id)}" ${pl.routeIds.includes(r.id) ? 'checked' : ''}><span style="width:12px;height:12px;border-radius:50%;background:${r.color};display:inline-block"></span>${U.esc(r.name)}</label>`).join('')}</div>
        <p class="hint">Tick more than one route only for a hold that is deliberately shared.</p></div>
      <div class="field"><label class="check"><input type="checkbox" id="hdOwn" ${pl.color ? 'checked' : ''}> Own colour instead of the route colour</label><input type="color" id="hdColor" value="${pl.color || colourOf(pl)}" aria-label="Hold colour"></div>
      <div class="field"><label for="hdNotes">Notes (movement, orientation, setting)</label><textarea id="hdNotes" maxlength="4000">${U.esc(pl.notes)}</textarea></div>`,
      buttons: [{ label: 'Duplicate', value: 'dup' }, { label: 'Cancel', value: null }, { label: 'Save', value: 'ok', kind: 'primary' }],
      onOpen: box => box.querySelector('#hdColor').addEventListener('input', () => { box.querySelector('#hdOwn').checked = true; }) });
    if (res.value === 'dup') { const cur = st.placement(pl.id); if (cur) RE().duplicate(cur); return; }
    if (res.value !== 'ok') return;
    const q = s => res.el.querySelector(s), cur = st.placement(pl.id);
    if (!cur) return;
    const ticked = new Set([...res.el.querySelectorAll('[data-memb]')].filter(b => b.checked).map(b => b.dataset.memb));
    const next = { catalogId: q('#hdCat').value, role: q('#hdRole').value, marker: q('#hdMark').value, rotation: U.normDeg(+q('#hdRot').value || 0),
      // Keep the stored order (the first route gives the hold its colour), then append new ones.
      routeIds: cur.routeIds.filter(r => ticked.has(r)).concat([...ticked].filter(r => !cur.routeIds.includes(r))),
      color: q('#hdOwn').checked ? q('#hdColor').value : null, notes: q('#hdNotes').value.slice(0, 4000) };
    if (Object.keys(next).every(k => JSON.stringify(next[k]) === JSON.stringify(cur[k]))) return;
    st.commit('Edit ' + pl.label, p2 => {
      const x = p2.placements.find(y => y.id === pl.id);
      for (const r of next.routeIds) if (!x.routeIds.includes(r)) RE().logRoute(p2, r, 'Added ' + x.label);
      for (const r of x.routeIds) if (!next.routeIds.includes(r)) RE().logRoute(p2, r, 'Removed ' + x.label);
      Object.assign(x, next);
    });
  }

  // On phones the share sheet is the dependable way to keep a file (Save to Files, Google Drive, AirDrop).
  async function shareOrDownload(name, text, mime) {
    try {
      const file = new File([text], name, { type: mime });
      if (window.matchMedia?.('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file] }); return 'shared'; }
    } catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
    U.download(name, text, mime);
    return 'downloaded';
  }
  async function saveProjectFile() {
    const st = ST(), p = st.exportObject();
    p.savedAt = U.nowIso();
    const name = `${U.slug(p.name)}-${p.savedAt.slice(0, 16).replace(/[-:]/g, '').replace('T', '-')}.routeform.json`;
    const how = await shareOrDownload(name, JSON.stringify(p, null, 1), 'application/json');
    if (how === 'cancelled') return;
    st.markFileSaved();
    A().toast(`Project file ${how === 'shared' ? 'shared' : 'downloaded'}: ${name}. Open it on the computer with File → Open project.`, 'ok', 6500);
  }

  // Registered photos whose footprint contains this hold, with the hold's pixel position in each.
  function photosShowing(m) {
    if (!m.ok) return [];
    const st = ST(), out = [];
    for (const ph of st.project.photos) {
      if (!ph.registration || !st.photoData.get(ph.dataRef)) continue;
      const Hi = G.inv3(ph.registration.H);
      if (!Hi) continue;
      const [u, v] = G.applyH(Hi, [m.x, m.y]);
      if (u >= 0 && v >= 0 && u <= ph.width && v <= ph.height) out.push({ ph, u, v });
    }
    return out;
  }
  function photoCompare(pl, m, photos) {
    const st = ST(), app = A();
    const html = photos.map(({ ph, u, v }) => `<h3>${U.esc(ph.name)} ${UI.badge(ph.registration.confidence)}</h3>
      <div style="position:relative;display:inline-block;max-width:100%"><img src="${st.photoData.get(ph.dataRef)}" alt="" style="max-width:100%;display:block;border-radius:8px">
      <span style="position:absolute;left:${(u / ph.width * 100).toFixed(2)}%;top:${(v / ph.height * 100).toFixed(2)}%;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid #ffe14d;border-radius:50%;box-shadow:0 0 0 2px #000"></span></div>
      <p class="hint">${U.esc(ph.caveat || '')} Photo date: ${U.esc(ph.dateTaken || 'unknown')}. Holds in the photo may be from an older set.</p>`).join('');
    app.modal({ title: `${pl.label} — where the photo alignment puts it`, html: html + '<div class="callout">Ring = planned position mapped through the photo registration. Alignment is an estimate; the hole reference above is what counts.</div>',
      buttons: [{ label: 'Show on wall', value: 'wall', kind: 'primary' }, { label: 'Close', value: null }] }).then(r => { if (r.value === 'wall') focusHold(pl, 0.5); });
  }

      ${editable() ? `<button class="btn primary bigbtn" id="saveProj">Save project file (.json)</button>

      el.querySelectorAll('[data-layer]').forEach(c => c.addEventListener('change', () => { st.ui.layers[c.dataset.layer] = c.checked; st.saveUi(); app.requestDraw(); }));

    const st = ST(), app = A();

      st.ui.selection = { kind: 'placement', id: pl.id }; st.ui.fieldTab = 'map';
      renderTabs(); renderPage(); renderSheet(); requestAnimationFrame(() => focusHold(pl, 0.4)); return;

    if (h) {

      renderTabs(); renderPage(); renderSheet(); requestAnimationFrame(() => app.view.centreOn(h.x, h.y, 0.5));

    const pe = [...st.index.panels.values()].find(e => e.panel.id.toLowerCase() === q.toLowerCase() || (e.panel.label || '').toLowerCase() === q.toLowerCase());

    if (!app.fieldOnly) { app.importPlan(res.project); return; }   // the web app: one more plan on this device
    // A read-only offline copy just shows the loaded plan instead.
    st.readOnly = false;

    st.readOnly = app.fieldOnly;
    st.saveLocal();

  }
  function calibrationInfo() {
    const st = ST(), p = st.project, prov = W.provenance(p, st.index);
    const counts = o => Object.entries(o).map(([k, n]) => `${UI.badge(k)} ${n}`).join(' ');
    A().modal({ title: 'What is measured vs estimated', html: `
      <p>${prov.allVerified ? 'All holds in this plan sit on field-verified holes.' : '<b>Positions in this plan are estimates.</b> The panel layout and hole pattern have not been fully measured; use the hole reference as a guide and confirm on the wall.'}</p>
      <dl class="kv"><dt>Wall height</dt><dd>${(p.wall.height.value / 1000).toFixed(2)} m ${UI.badge(p.wall.height.confidence)}</dd><dt>Sector width</dt><dd>${(p.sector.width.value / 1000).toFixed(2)} m ${UI.badge(p.sector.width.confidence)}</dd>
      <dt>Panels</dt><dd>${counts(prov.panelConf)}</dd><dt>Holes</dt><dd>${counts(prov.holeConf)}</dd><dt>Fixtures</dt><dd>${counts(prov.fixtureConf)}</dd>

<script data-rf>
/* ROUTEFORM 0.2 — ui-climb.js
 * Climber player for the routesetting view and the phone view: open it on a route, then play/pause,
 * step, scrub, pick the figure's size, speed, top rope or lead, and let the view follow. Draws the figure
 * (head turned to the next hold) and the rope, which on lead runs through the clipped quickdraws.
 * "Heights…" compares the same route for several climber heights.
 * The rules and body model live in climber.js; nothing here changes the project. */
(function (RF) {
  'use strict';
  const U = RF.util, CL = RF.climb;

  const SPEEDS = [0.5, 1, 1.5, 2, 4];
  const CHECK_HEIGHTS = [150, 160, 170, 180, 190, 200];
  const COL = { out: '#0d1218', skin: '#cfd6df', shirt: '#1f5f99', pants: '#2c333c', shoe: '#d2452f', harness: '#f2c230', rope: '#efe9d8', target: '#ffd166', long: '#ff5a4f' };

  const climb = {
    active: false, routeId: null, plan: null, t: 0, playing: false, raf: 0, last: 0, prevDisplay: null, unsub: null,

    prefs() {
      const st = ST();

      return st.ui.climber;
    },

    open(routeId) {
      const app = A(), st = ST();
      if (!routeId || !['route', 'field'].includes(st.ui.mode)) return;
      if (this.active) this.close();
      this.routeId = routeId; this.t = 0; this.plan = null;
      if (!this.replan()) return;
      st.ui.activeRouteId = routeId; st.ui.selection = null; st.ui.tool = 'select';
      // Phone: show just this route on the Wall tab; the editing tools step aside while it plays.
      if (st.ui.mode === 'field') { st.ui.fieldRoute = routeId; st.ui.fieldTab = 'map'; st.ui.fieldTool = 'select'; }
      this.prevDisplay = st.ui.display;
      if (st.ui.display === 'all') st.ui.display = 'focus';
      this.unsub = st.on(type => this.onStore(type));
      this.active = true;
      this.buildBar();
      $('stage').classList.add('climbing');
      app.renderPanels();
      this.frameView();
      this.play();
    },
    close() {
      if (!this.active) return;
      const st = ST();
      this.active = false; this.playing = false;
      cancelAnimationFrame(this.raf); this.raf = 0;
      this.unsub?.(); this.unsub = null;
      if (this.prevDisplay && st.ui.display === 'focus') st.ui.display = this.prevDisplay;
      $('climbBar')?.remove();
      $('stage')?.classList.remove('climbing');
      this.plan = null;
      A().renderPanels(); A().requestDraw();
    },
    /* Recompute the climb (route edited, figure changed). Keeps the position by move number. */
    replan() {
      const st = ST(), pr = this.prefs(), done = this.plan ? this.completed(this.t) : 0;
      const pl = CL.plan(st.project, st.index, this.routeId, { heightMm: pr.heightCm * 10, apeMm: pr.apeCm * 10, lead: pr.lead });
      if (!pl.ok) { A().toast(pl.reason, 'warn'); return false; }
      this.plan = pl;
      if (this.t > 0) { const m = pl.moves[Math.min(done, pl.moves.length - 1)]; this.t = done >= pl.moves.length ? pl.total : m.t0; }
      return true;
    },
    onStore(type) {
      if (!this.active) return;
      if (type === 'load' || !ST().route(this.routeId)) { this.close(); return; }
      if (type === 'change') { if (this.replan()) { this.syncBar(true); A().requestDraw(); } else this.close(); }
    },

    // ---- playback ----------------------------------------------------------------------
    completed(t) { let i = 0; const ms = this.plan.moves; while (i < ms.length && t >= ms[i].t0 + ms[i].dur - 1e-6) i++; return i; },
    play() { if (this.t >= this.plan.total) this.t = 0; this.playing = true; this.last = performance.now(); this.loop(); this.syncBar(); },
    pause() { this.playing = false; this.syncBar(); },
    toggle() { this.playing ? this.pause() : this.play(); },
    loop() { if (!this.raf) this.raf = requestAnimationFrame(now => this.tick(now)); },
    tick(now) {

      this.syncBar();

    },
    seek(t) { this.t = U.clamp(t, 0, this.plan.total); this.follow(true); A().requestDraw(); this.syncBar(); },
    step(dir) {

    nextLong() {

    },

    // ---- view -------------------------------------------------------------------------------

    },
    /* Keep the figure inside the middle of the view (and clear of the player bar). */
    follow(force) {

        <div class="cb-row">

          <button class="btn icon" id="cbPrev" title="Previous move (,)" aria-label="Previous move">◀</button>
          <button class="btn primary cb-play" id="cbPlay" title="Play / pause (Space)"></button>
          <button class="btn icon" id="cbNext" title="Next move (.)" aria-label="Next move">▶</button>
          <input type="range" id="cbScrub" class="cb-scrub" min="0" max="1000" step="1" aria-label="Position in the climb">
        </div>
        <div class="cb-row cb-opts">
          <label>Climber <select id="cbHeight">${opt(HEIGHTS, pr.heightCm, v => v + ' cm')}</select></label>
          <label>Arm span <select id="cbApe">${APES.map(([v, t]) => `<option value="${v}" ${v === pr.apeCm ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
          <label>Rope <select id="cbRope"><option value="top" ${pr.lead ? '' : 'selected'}>Top rope</option><option value="lead" ${pr.lead ? 'selected' : ''}>Lead (clipping)</option></select></label>
          <label>Speed <select id="cbSpeed">${opt(SPEEDS, pr.speed, v => v + '×')}</select></label>
          <label class="check"><input type="checkbox" id="cbFollow" ${pr.follow ? 'checked' : ''}> Follow</label>
          <button class="chip" id="cbHeights" title="Compare this route for climbers of different heights">Heights…</button>
          <button class="chip warn" id="cbFlags" hidden title="Jump to the next long reach, feet-off move or clipping issue"></button>
        </div>

      $('cbNext').addEventListener('click', () => this.step(1));
      $('cbPlay').addEventListener('click', () => this.toggle());
      $('cbScrub').addEventListener('input', e => { this.pause(); this.seek(e.target.value / 1000 * this.plan.total); });

    },
    syncBar(full) {

      const set = (id, prop, val) => { const el = $(id); if (el[prop] !== val) el[prop] = val; };

    },

    /* The same route for several climber heights, from the same simple rules. Tap a row to watch it. */
    async heightsDialog() {
      const st = ST(), pr = this.prefs(), r = st.route(this.routeId);
      if (!r) return;
      const rows = CL.heights(st.project, st.index, this.routeId, CHECK_HEIGHTS, { apeMm: pr.apeCm * 10, lead: pr.lead });
      const cell = n => (n ? `<b class="warn-t">${n}</b>` : '0');
      const res = await A().modal({ title: `Reach check · ${r.name}`, html: `
        <p>The same route for climbers of different heights${pr.apeCm ? ` (arm span ${pr.apeCm > 0 ? '+' : ''}${pr.apeCm} cm)` : ''}${pr.lead ? ', on lead' : ''}. Counts come from the animation's simple rules on placeholder wall geometry: a hint where to look, not a grade or a safety check.</p>

        ${rows.map(x => x.ok ? `<tr data-hcm="${x.cm}" class="${x.cm === pr.heightCm ? 'on' : ''}"><td><button type="button" class="btn small">${x.cm} cm ▶</button></td><td>${cell(x.long)}</td><td>${cell(x.feetOff)}</td>${pr.lead ? `<td>${cell(x.missed)}</td><td>${cell(x.awkward)}</td>` : ''}</tr>` : `<tr><td>${x.cm} cm</td><td colspan="4">${U.esc(x.reason)}</td></tr>`).join('')}

        buttons: [{ label: 'Close', value: null }],
        onOpen: (box, done) => box.querySelectorAll('[data-hcm] button').forEach(b => b.addEventListener('click', () => done(+b.closest('[data-hcm]').dataset.hcm))) });
      if (!res.value || !this.active) return;
      pr.heightCm = res.value; ST().saveUi();
      $('cbHeight').value = String(res.value);
      this.replan(); this.syncBar(true); A().requestDraw();
    },

    onKey(e) {
      if (!this.active) return false;
      const k = e.key;
      if (k === ' ') { e.preventDefault(); this.toggle(); return true; }
      if (k === ',' || k === '<') { this.step(-1); return true; }
      if (k === '.' || k === '>') { this.step(1); return true; }
      if (k === 'Escape') { this.close(); return true; }
      return false;

      st.readOnly = false; st.ui.selection = { kind: 'placement', id: fpl.id }; app.renderPanels();
      check('Phone: a read-only plan shows no editing tools (▶ Climb stays)', roOk);

      // Phone climber: ▶ Climb on the Wall tab plays the chosen route to the finish, fits the screen, changes nothing.
      const beforeClimbP = st.contentHash(), clp = app.climb;
      st.ui.fieldRoute = 'route-a'; app.renderPanels();
      q('#ftClimb').click(); await wait(250);
      const barR = q('#climbBar')?.getBoundingClientRect();
      const playing = clp.active && clp.routeId === 'route-a' && clp.t > 0 && sheet.dataset.open === 'false' && q('#fieldTools').dataset.on === 'false';
      const finP = st.project.placements.find(x => x.routeIds.includes('route-a') && x.marker === 'finish');
      clp.seek(clp.plan.total); v.draw();
      const endP = clp.plan.frames[clp.plan.frames.length - 1].state;
      const cbSmall = [...document.querySelectorAll('#climbBar button, #climbBar select')].filter(b => b.offsetParent && b.getBoundingClientRect().height < 43.5);
      const fitsP = barR && barR.left >= 0 && barR.right <= window.innerWidth + 0.5 && document.documentElement.scrollWidth <= window.innerWidth + 1;
      const tapsIgnored = (await tap(cv, fx, fy, 'touch'), sheet.dataset.open === 'false' && !st.ui.selection);
      q('#cbClose').click();
      check('Phone: ▶ Climb plays the route to the finish on a phone-sized bar and changes nothing', playing && endP.lh?.hold.id === finP.id && fitsP && !cbSmall.length && tapsIgnored && !clp.active && q('#fieldTools').dataset.on === 'true' && st.contentHash() === beforeClimbP,
        `bar ${barR ? Math.round(barR.height) : '?'} px${cbSmall.length ? ' · small: ' + cbSmall.map(b => b.id).join(',') : ''}`);
      st.ui.fieldRoute = 'all'; st.ui.selection = { kind: 'placement', id: fpl.id }; app.renderPanels();

      // Full screen: the route chips and tabs go away and the wall gets their space; the same button brings them back.
      const stageH0 = q('#stage').getBoundingClientRect().height;
      q('#fullBtn').click(); await wait(80);
      const fullOk = !q('#fieldTop').offsetParent && !q('#fieldTabs').offsetParent && q('#stage').getBoundingClientRect().height > stageH0 + 40 && q('#fullBtn').getAttribute('aria-pressed') === 'true';
      const stageH1 = q('#stage').getBoundingClientRect().height;
      q('#fullBtn').click(); await wait(80);
      check('Phone: full screen hides the route chips and tabs, and the same button brings them back', fullOk && !!q('#fieldTop').offsetParent && !!q('#fieldTabs').offsetParent && Math.abs(q('#stage').getBoundingClientRect().height - stageH0) < 1, `map ${Math.round(stageH0)} → ${Math.round(stageH1)} px`);

      const buttons = [...document.querySelectorAll('.field-tabs button, .rchip, .statusbtns button, .navbtns button, .seg2 button, .ftools .btn, .editbar button')].filter(b => b.offsetParent);
      const small = buttons.filter(b => { const r = b.getBoundingClientRect(); return r.height < 43.5 || r.width < 43.5; });
      check('Phone: primary touch targets ≥ 44 px', !small.length, small.map(b => b.textContent.trim().slice(0, 12)).join(', '));
      check('Phone: no horizontal page overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, `${document.documentElement.scrollWidth}px`);
      // iPhone Safari zooms the whole page into any text field under 16 px (hold note, Find boxes).
      q('#shMore').click(); await wait(30);
      const fsz = el => (el ? parseFloat(getComputedStyle(el).fontSize) : 0), sizes = [fsz(q('#shNote'))];
      q('#shMore').click(); await wait(30);
      for (const tab of ['list', 'more', 'map']) { q(`[data-ft="${tab}"]`).click(); await wait(50); if (tab !== 'map') sizes.push(fsz(q('#findInput'))); }
      check('Phone: text fields are 16 px or larger, so iPhone Safari does not zoom in', sizes.every(z => z >= 16), sizes.join(' / ') + ' px');
      // Colour schemes (More → Colours): Daylight turns the interface light, Amber brings the original back.
      const bgSum = () => getComputedStyle(document.body).backgroundColor.match(/\d+/g).slice(0, 3).reduce((a, b) => a + +b, 0) / 3;
      q('[data-ft="more"]').click(); await wait(50);
      q('#fieldPage [data-theme-pick="day"]').click(); await wait(30);
      const dayBg = bgSum(), dayOn = q('#fieldPage [data-theme-pick="day"]').classList.contains('on'), dayScheme = document.documentElement.style.colorScheme;
      q('#fieldPage [data-theme-pick="amber"]').click(); await wait(30);
      const amberBg = bgSum();
      q('[data-ft="map"]').click(); await wait(30);
      check('Colour schemes: Daylight turns the interface light; Amber brings back the original dark colours', dayBg > 200 && dayOn && dayScheme === 'light' && amberBg < 30 && RF.theme.choice === 'amber', `background ${Math.round(dayBg)} → ${Math.round(amberBg)}`);
      st.progress.items = {}; st.saveProgress();

      // Offline field file boots (only when the app code is inline, i.e. the built single file).
      try {
        const html = await RF.exporters.buildFieldHtml(st.exportObject());
        const ifr = document.createElement('iframe');
        ifr.style.cssText = 'position:fixed;width:360px;height:640px;left:-9999px;top:0';
        ifr.srcdoc = html; document.body.appendChild(ifr);
        let ok = false;
        for (let i = 0; i < 40 && !ok; i++) { await wait(100); ok = !!ifr.contentWindow?.RF?.app?.ready; }
        const w = ifr.contentWindow;
        check('Offline field file boots read-only with the embedded plan', ok && w.RF.app.fieldOnly && w.RF.app.store.readOnly && w.RF.app.store.project.placements.length === st.project.placements.length, `${(html.length / 1024).toFixed(0)} KB`);
        ifr.remove();
      } catch (e) { check('Offline field file boots read-only with the embedded plan', false, e.message); }
      check('QR encoder produces a code for a LAN URL', RF.qr.make('http://192.168.1.20:8737/routeform.html?mode=field#plan=graveggen-sector-r3-abcdef').size >= 21);
    } catch (e) {
      check('Self-test crashed', false, e.stack || e.message);
    } finally {
      // Remove everything the test stored, then go back to the real plan.
      st.cancelSave();
      try { for (const x of st.plans().plans) await st.deletePlan(x.id); localStorage.removeItem(st.plansKey()); } catch (e) { /* storage blocked */ }
      try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.includes('.selftest.')) localStorage.removeItem(k); } } catch (e) { /* storage blocked */ }
      Object.assign(st, { ns: real.ns, slotId: real.slotId });
      RF.theme.set(savedTheme);
      const res = S.validateProject(saved);
      st.readOnly = false;
      if (res.ok) st.load(res.project, { noSave: true });
      st.saveState = real.saveState; st.savedAt = real.savedAt;
      st.readOnly = wasRO;
      app.setMode(savedMode);
      app.view.fitSector();
    }
    const pass = results.filter(r => r.ok).length;
    RF.selftestResults = results;
    app.modal({ title: `Self-test: ${pass}/${results.length} passed`, wide: true, html: `<table class="mini">${results.map(r => `<tr><td>${r.ok ? '✅' : '❌'}</td><td>${U.esc(r.name)}</td><td class="mono">${U.esc(r.detail)}</td></tr>`).join('')}</table>
      <p class="hint">Browser: ${U.esc(navigator.userAgent)} · viewport ${window.innerWidth}×${window.innerHeight}. Your project was restored afterwards.</p>` });

  }

  RF.selftest = run;
  if (typeof location !== 'undefined' && /[?&]selftest=1/.test(location.search)) {
    const go = () => (RF.app?.ready ? run() : setTimeout(go, 200));
    setTimeout(go, 300);
  }
})(globalThis.RF = globalThis.RF || {});

<script data-rf>
/* ROUTEFORM 0.2 — app.js

(function (RF) {
  'use strict';
  const U = RF.util, S = RF.schema, W = RF.wall;
  const $ = id => document.getElementById(id);

  const app = RF.app = {
    store: new RF.Store(), view: null, modes: RF.modes || {}, climb: RF.climbUi, dragState: null, fieldOnly: false, server: null,
    mode() { return this.modes[this.store.ui.mode]; },
    requestDraw() { this.view?.requestDraw(); },
    select(sel) { this.store.ui.selection = sel; this.renderPanels(); this.requestDraw(); },
    renderPanels() {
      if (!this.store.project) return;

      this.renderRibbon();
      this.mode()?.renderPanels?.();
    },
    onViewChange() { this.mode()?.onViewChange?.(); },
    onDrawn() { this.view.drawMinimap($('miniCanvas')); },
    status(msg) { const el = $('status'); if (el) el.textContent = msg || ''; this.mode()?.onStatus?.(msg); }
  };

  // ---- skeleton --------------------------------------------------------------------
  function buildShell() {
    const root = document.createElement('div');
    root.className = 'rf'; root.id = 'rf-app';
    root.innerHTML = `
<header class="topbar">
  <div class="brand"><div class="brandmark" aria-hidden="true"></div><div><div class="brandname">ROUTEFORM <span class="pill">0.2 · PRELIMINARY</span></div><div class="subbrand" id="projName"></div></div></div>
  <nav class="modes" role="tablist" aria-label="Workspace mode">
    <button role="tab" data-mode="route">Routesetting</button><button role="tab" data-mode="survey">Wall survey</button><button role="tab" data-mode="field">Phone / field view</button>
  </nav>
  <div class="top-actions">
    <button class="btn subtle icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button class="btn subtle icon" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
    <span id="saveInd" class="save-ind" aria-live="polite"></span>
    <span id="revChip" class="chip" title="Project revision"></span>
    <button class="btn" id="fileBtn" aria-haspopup="menu">File ▾</button>
    <button class="btn primary" id="shareBtn">Send to phone ↗</button>
  </div>
</header>
<div class="ribbon" id="ribbon" role="status"></div>
<div id="fieldTop" class="field-top"></div>
<div class="workspace">
  <aside id="leftPanel" class="side left" aria-label="Tools"></aside>
  <main class="stage" id="stage">
    <canvas id="wallCanvas" role="img" aria-label="Front elevation of the wall sector with holes, holds and routes"></canvas>
    <div class="hud hud-tl"><span class="prelim" title="Wall geometry is not yet calibrated">PRELIMINARY · UNCALIBRATED</span><span id="readout" class="readout" hidden></span></div>
    <div class="hud hud-tr">
      <button class="btn icon" data-zoom="in" aria-label="Zoom in">+</button>
      <button class="btn icon" data-zoom="out" aria-label="Zoom out">−</button>
      <button class="btn" data-zoom="fit" aria-label="Fit sector">Fit</button>

      <select id="bandSel" aria-label="Jump to height band"></select>

    <div class="hud hud-bl" id="status" aria-live="polite"></div>

    <div id="fieldPage" class="field-page"></div>
    <div id="fieldSheet" class="field-sheet" role="dialog" aria-label="Hold details"></div>
  </main>
  <aside id="rightPanel" class="side right" aria-label="Inspector"></aside>
</div>
<nav id="fieldTabs" class="field-tabs" aria-label="Field view sections"></nav>
<div id="modalRoot"></div><div id="toastRoot" class="toasts" aria-live="polite"></div>
<input type="file" id="fileInput" hidden>`;
    document.body.appendChild(root);
  }

  // ---- toasts / modal / menu ------------------------------------------------------------
  app.toast = (msg, kind = '', ms = 4200) => {
    const t = document.createElement('div');
    t.className = 'toast ' + kind; t.textContent = msg;
    $('toastRoot').appendChild(t);
    setTimeout(() => t.remove(), ms);
  };
  app.modal = ({ title, html, buttons = [{ label: 'Close', value: null }], wide = false, onOpen }) => new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}"><header>${U.esc(title)}</header><div class="body">${html}</div><footer></footer></div>`;
    const foot = back.querySelector('footer'), box = back.querySelector('.modal');
    const done = value => { back.remove(); document.removeEventListener('keydown', onKey, true); resolve({ value, el: box }); };
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.kind || ''); btn.textContent = b.label;

  app.confirm = async (title, html, okLabel = 'OK', kind = 'primary') => (await app.modal({ title, html, buttons: [{ label: 'Cancel', value: false }, { label: okLabel, value: true, kind }] })).value === true;
  app.menu = (anchor, items) => {
    document.querySelector('.menu')?.remove();
    const m = document.createElement('div');

    for (const it of items) {
      if (it === '-') { m.appendChild(document.createElement('hr')); continue; }

      m.appendChild(b);
    }

    const r = anchor.getBoundingClientRect();
    m.style.top = (r.bottom + 6) + 'px';
    m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r.right - m.offsetWidth)) + 'px';
    setTimeout(() => document.addEventListener('click', function off(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('click', off); } }), 0);
    m.querySelector('button')?.focus();
  };
  app.pickFile = accept => new Promise(resolve => {
    const inp = $('fileInput');
    inp.value = ''; inp.accept = accept;
    inp.onchange = () => resolve(inp.files?.[0] || null);
    inp.click();
  });

  // ---- top bar & ribbon ------------------------------------------------------------------
  app.renderTop = () => {
    const st = app.store, p = st.project;
    $('projName').textContent = `${p.wall.name} · ${p.name}`;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === st.ui.mode)));
    $('undoBtn').disabled = !st.undoStack.length || st.readOnly;
    $('redoBtn').disabled = !st.redoStack.length || st.readOnly;
    $('undoBtn').title = st.undoStack.length ? 'Undo: ' + st.undoStack[st.undoStack.length - 1].label + ' (Ctrl+Z)' : 'Nothing to undo';
    $('redoBtn').title = st.redoStack.length ? 'Redo: ' + st.redoStack[st.redoStack.length - 1].label + ' (Ctrl+Y)' : 'Nothing to redo';
    const r = p.revision, dirty = st.hasUnpublishedChanges();
    const chip = $('revChip');
    chip.className = 'chip ' + (dirty ? 'warn' : 'ok');
    chip.textContent = r ? `Rev ${r.number}${dirty ? ' · unpublished edits' : ' · published'}` : 'Draft · no revision yet';
    chip.title = `Project revision. The phone export always carries a specific revision. ${app.saveText()}. File → Save project keeps a copy outside this browser.`;
    const ind = $('saveInd');
    ind.textContent = st.readOnly ? '' : { pending: 'Saving…', saving: 'Saving…', saved: '✓ Saved', 'saved-no-photos': '✓ Saved (no photos)', failed: '⚠ Not saved', idle: '' }[st.saveState] || '';
    ind.className = 'save-ind ' + (st.saveState === 'failed' ? 'bad' : '');
    ind.title = app.saveText();
  };
  app.renderRibbon = () => {
    const st = app.store, p = st.project, pr = W.provenance(p, st.index), el = $('ribbon');
    const C = S.CONF, holeStr = Object.entries(pr.holeConf).map(([k, n]) => `${n} ${C[k]?.label.toLowerCase() || k}`).join(', ');
    el.classList.toggle('verified', pr.allVerified);
    if (pr.allVerified) {
      el.innerHTML = `<b>FIELD-VERIFIED POSITIONS</b><span class="grow">All ${pr.total} holds sit on field-verified holes. This is still a planning aid, not a safety or installation approval.</span><button class="btn small" id="ribbonMore">Details</button>`;
    } else {
      el.innerHTML = `<b>UNVERIFIED WALL GEOMETRY · PRELIMINARY</b><span class="grow">Sector width ${(p.sector.width.value / 1000).toFixed(2)} m (${C[p.sector.width.confidence].label.toLowerCase()}); holes: ${U.esc(holeStr)}. ${pr.onEstimated} of ${pr.total} holds use estimated positions${pr.review ? ` · ${pr.review} flagged for review` : ''}${pr.unresolved ? ` · ${pr.unresolved} unresolved` : ''}. Not an installation or safety reference.</span><button class="btn small" id="ribbonMore">Details</button>`;
    }
    $('ribbonMore').onclick = showProvenance;
  };
  function showProvenance() {
    const st = app.store, p = st.project, pr = W.provenance(p, st.index), C = S.CONF;
    const badge = c => `<span class="conf" style="background:${C[c]?.color || '#666'}">${C[c]?.label || c}</span>`;
    const rows = (obj) => Object.entries(obj).map(([k, n]) => `${badge(k)} × ${n}`).join(' ') || '—';
    app.modal({ title: 'Calibration & provenance', wide: true, html: `
      <p>ROUTEFORM tracks confidence per property and per point. Nothing here is "100% accurate"; it is only as good as the measurements entered.</p>
      <dl class="kv">

        <dt>Sector</dt><dd>x0 ${(p.sector.x0.value / 1000).toFixed(2)} m, width ${(p.sector.width.value / 1000).toFixed(2)} m ${badge(p.sector.width.confidence)} <small>${U.esc(p.sector.width.source)}</small></dd>

        <dt>Mounting holes</dt><dd>${rows(pr.holeConf)}</dd>
        <dt>Facility fixtures</dt><dd>${rows(pr.fixtureConf)} <small>read-only reference layer; never an installation instruction</small></dd>
        <dt>Holds</dt><dd>${pr.onVerified} on verified holes · ${pr.onEstimated} on estimated positions (${pr.screwOn} screw-on) · ${pr.unresolved} unresolved · ${pr.review} flagged for review</dd>
      </dl>
      <h3>Confidence levels</h3>
      <dl class="kv">${Object.entries(C).map(([k, v]) => `<dt>${badge(k)}</dt><dd>${U.esc(v.desc)}</dd>`).join('')}</dl>
      <div class="callout bad">ROUTEFORM never certifies that a route is safe or climbable, that anchors or protection are appropriate, or that a hold position is approved. Experienced setters and the gym's own procedures remain authoritative.</div>` });
  }

  // ---- HUD -----------------------------------------------------------------------------------
  function renderBands() {
    const p = app.store.project, H = p.wall.height.value, sel = $('bandSel');
    const opts = ['<option value="">Height…</option>', '<option value="all">Full height</option>'];

    sel.innerHTML = opts.join('');
  }
  function renderLayers() {
    const L = app.store.ui.layers;
    const items = [['paint', 'Painted colour regions'], ['photo', 'Photo underlays'], ['seams', 'Panel seams'], ['holes', 'Mounting holes'], ['confidence', 'Colour holes by confidence'],
      ['fixtures', 'Facility fixtures (read-only)'], ['ropes', 'Rope lines'], ['labels', 'Labels'], ['outside', 'Dim outside sector'], ['progress', 'On-wall progress marks']];
    $('layersPop').innerHTML = '<h2>Layers</h2>' + items.map(([k, t]) => `<label class="check"><input type="checkbox" data-layer="${k}" ${L[k] ? 'checked' : ''}> ${t}</label>`).join('');
  }
  function wireHud() {
    $('fullBtn').addEventListener('click', () => RF.modes.field?.toggleFull());
    document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
      const z = b.dataset.zoom;
      if (z === 'in') app.view.zoomBy(1.5); else if (z === 'out') app.view.zoomBy(1 / 1.5); else app.view.fitSector();

    $('layersPop').addEventListener('change', e => {
      const k = e.target.dataset.layer;
      if (!k) return;
      app.store.ui.layers[k] = e.target.checked; app.store.saveUi(); app.requestDraw();
    });
    document.addEventListener('click', e => { const pop = $('layersPop'); if (!pop.hidden && !pop.contains(e.target) && e.target.id !== 'layersBtn') pop.hidden = true; });

    let miniDrag = false;
    mini.addEventListener('pointerdown', e => { miniDrag = true; mini.setPointerCapture(e.pointerId); app.view.minimapJump(mini, e.clientX, e.clientY); });

  }

    prev?.unmount?.();
    st.ui.mode = m; st.ui.selection = null; st.saveUi();
    document.body.classList.toggle('field', m === 'field');
    $('rf-app').classList.toggle('fieldmode', m === 'field');

    app.renderPanels();
    requestAnimationFrame(() => app.view.resize());
  };

  // ---- file operations (shared by menus) -------------------------------------------------------
  app.loadProjectText = async (text, sourceName) => {
    const res = S.validateProject(text);
    if (!res.ok) {
      app.modal({ title: 'Could not open ' + (sourceName || 'file'), html: `<p>Nothing was changed. Problems found:</p><ul>${res.errors.slice(0, 20).map(e => `<li>${U.esc(e)}</li>`).join('')}</ul>` });
