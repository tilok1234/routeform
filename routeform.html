    }
    if (res.warnings.length) {
      const ok = await app.confirm('Open with warnings?', `<p>The file is valid but has ${res.warnings.length} warning(s):</p><ul>${res.warnings.slice(0, 25).map(w => `<li>${U.esc(w)}</li>`).join('')}</ul>`, 'Open anyway');
      if (!ok) return false;
    }
    return app.importPlan(res.project);
  };
  app.openProject = async () => {
    const f = await app.pickFile('.json,application/json');
    if (!f) return;
    if (f.size > 80e6) return app.toast('File is larger than 80 MB.', 'bad');
    app.loadProjectText(await U.readFile(f), f.name);
  };
  app.saveProject = () => {
    const p = app.store.exportObject();
    p.savedAt = U.nowIso();
    U.download(`${U.slug(p.name)}.routeform.json`, JSON.stringify(p, null, 1), 'application/json');
    app.store.markFileSaved();
    app.toast('Project file downloaded. Keep it somewhere safe: it is a copy outside this browser.', 'ok');
  };

  // ---- plans on this device ----------------------------------------------------------------------
  const isIos = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const homeScreenApp = () => navigator.standalone === true || !!window.matchMedia?.('(display-mode: standalone)').matches;
  app.deviceName = () => (/iPad/.test(navigator.userAgent) || (isIos() && !/iPhone|iPod/.test(navigator.userAgent)) ? 'iPad'
    : isIos() ? 'iPhone' : /Android|Mobile/.test(navigator.userAgent) ? 'phone' : 'computer');
  app.when = iso => {
    if (!iso) return 'never';
    const d = new Date(iso), now = new Date(), sec = (now - d) / 1000, hm = d.toTimeString().slice(0, 5);
    if (sec < 50) return 'just now';
    if (sec < 3600) return Math.round(sec / 60) + ' min ago';
    if (d.toDateString() === now.toDateString()) return 'today ' + hm;
    if (d.toDateString() === new Date(now - 864e5).toDateString()) return 'yesterday ' + hm;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) });
  };
  app.saveText = () => {
    const st = app.store, dev = app.deviceName();
    if (st.readOnly) return 'Read-only copy';
    return { pending: 'Saving…', saving: 'Saving…', saved: `Saved on this ${dev} ${app.when(st.savedAt)}`, 'saved-no-photos': `Saved on this ${dev} without the photos (not enough space)`,
      failed: `Not saved on this ${dev}: its storage is full or blocked. Save a file to keep your changes`, idle: '' }[st.saveState] || '';
  };
  // How safe the stored plans are here, in plain words (Safari clears unused sites' data; Home Screen apps keep it).
  app.storageNote = async () => {
    const dev = app.deviceName();
    let kept = false;
    try { kept = !!(await navigator.storage?.persisted?.()); } catch (e) { /* unknown */ }
    if (homeScreenApp() && isIos()) return `Kept on this ${dev} until you delete them or remove ROUTEFORM from the Home Screen. (The Home Screen app and Safari keep separate plans.)`;
    if (kept || homeScreenApp()) return `This browser has agreed to keep these plans on this ${dev}. Clearing the browser's website data would still delete them.`;
    if (isIos()) return 'Safari can delete a website\'s saved data if you use Safari for a week without opening it. To keep plans safe, use ROUTEFORM from the Home Screen (Share → Add to Home Screen) and save a file now and then. The Home Screen app and Safari keep separate plans.';
    return `The browser can delete saved website data when space runs low or when browsing data is cleared. Save a file now and then to be safe.`;
  };
  app.afterPlanChange = msg => {
    const st = app.store;
    st.ui.selection = null; st.ui.fieldTab = 'map'; st.ui.fieldRoute = 'all';
    renderBands();
    app.view.fitSector();
    app.renderPanels();
    if (msg) app.toast(msg, 'ok');
  };
  app.switchPlan = async id => {
    app.climb?.close();
    const res = await app.store.openPlan(id);
    if (!res.ok) { app.toast('Could not open that plan: ' + res.errors[0], 'bad', 8000); return false; }
    app.afterPlanChange(`Opened "${res.project.name}".`);
    return true;
  };
  /* A project from a file becomes a plan on this device. If the same plan is already stored here,
   * ask whether the file replaces it or both are kept. */
  app.importPlan = async project => {
    const st = app.store, dev = app.deviceName(), same = st.plans().plans.find(x => x.projectId === project.projectId);
    let replaceId = null;
    if (same) {
      const r = await app.modal({ title: `Already on this ${dev}`, html: `
        <p><b>${U.esc(same.name)}</b> (saved ${U.esc(app.when(same.savedAt))}) is the same plan as this file. Replace it with the file, or keep both?</p>
        <p class="hint">Replacing loses any changes made on this ${dev} since the file was saved.</p>`,
        buttons: [{ label: 'Cancel', value: null }, { label: 'Keep both', value: 'both' }, { label: 'Replace', value: 'replace', kind: 'primary' }] });
      if (!r.value) return false;
      if (r.value === 'replace') replaceId = same.id;
    }
    app.climb?.close();
    await st.addPlan(project, replaceId);
    app.afterPlanChange(replaceId ? `Opened "${project.name}" from the file.` : `Opened "${project.name}". It's now one of the plans on this ${dev}.`);
    return true;
  };
  app.plansDialog = async () => {
    const st = app.store, dev = app.deviceName();
    await st.flushSave();
    const note = await app.storageNote();
    let renaming = null, deleting = null;
    const rows = () => {
      const list = [...st.plans().plans].sort((a, b) => (b.id === st.slotId) - (a.id === st.slotId) || String(b.savedAt).localeCompare(String(a.savedAt)));
      return list.map(x => {
        const open = x.id === st.slotId;
        const head = renaming === x.id
          ? `<div class="plan-rename"><input id="plName" value="${U.esc(x.name)}" maxlength="120" aria-label="Plan name" autocomplete="off"><button type="button" class="btn primary" data-pact="saveName">Save</button></div>`
          : `<button type="button" class="plan-main" data-pact="open" ${open ? 'aria-current="true"' : ''}><b>${U.esc(x.name)}</b>
             <span>${U.esc(x.wall)} · ${x.routes} route${x.routes === 1 ? '' : 's'} · ${x.holds} hold${x.holds === 1 ? '' : 's'}${x.revision ? ' · rev ' + x.revision : ''}</span>
             <span>Saved ${U.esc(app.when(x.savedAt))} · file: ${U.esc(x.fileAt ? app.when(x.fileAt) : 'none yet')}</span></button>`;
        return `<div class="plan ${open ? 'open' : ''}" data-plan="${U.esc(x.id)}">${head}
          <div class="plan-acts">${open ? '<span class="chip ok">Open now</span>' : '<button type="button" class="btn small primary" data-pact="open">Open</button>'}
          <button type="button" class="btn small" data-pact="rename">Rename</button><button type="button" class="btn small" data-pact="copy">Copy</button>
          <button type="button" class="btn small danger" data-pact="del">${deleting === x.id ? 'Delete for good?' : 'Delete'}</button></div></div>`;
      }).join('') || '<p class="muted">No plans saved yet.</p>';
    };
    const res = await app.modal({ title: `Plans on this ${dev}`, wide: true, html: `
      <p>Every change is saved on this ${dev} by itself, a moment after you make it. Tap a plan to open it; the one you leave stays saved.</p>
      <div class="plans" id="planRows">${rows()}</div>
      <p class="hint" id="storageNote">${U.esc(note)}</p>`,
      buttons: [{ label: 'Close', value: null }, { label: 'Open a plan file…', value: { file: true } }, { label: '＋ New plan…', value: { add: true }, kind: 'primary' }],
      onOpen: (box, done) => {
        const list = box.querySelector('#planRows');
        const redraw = () => { list.innerHTML = rows(); list.querySelector('#plName')?.focus(); };
        list.addEventListener('click', async e => {
          const b = e.target.closest('[data-pact]'), row = b?.closest('[data-plan]');
          if (!b || !row) return;
          const id = row.dataset.plan, act = b.dataset.pact;
          if (act !== 'del') deleting = null;
          if (act === 'open') { if (id !== st.slotId) done({ open: id }); return; }
          if (act === 'rename') { renaming = id; redraw(); return; }
          if (act === 'saveName') {
            const name = (list.querySelector('#plName').value.trim() || 'Untitled plan').slice(0, 120);
            if (id === st.slotId) { st.commit('Rename plan', p => { p.name = name; }); await st.flushSave(); }
            else await st.editStoredPlan(id, p => { p.name = name; });
            renaming = null; redraw(); return;
          }
          if (act === 'copy') { const c = await st.copyPlan(id); app.toast(c ? 'Copy saved on this ' + dev + '.' : 'Could not make a copy (storage full?).', c ? 'ok' : 'bad'); redraw(); return; }
          if (act === 'del') {
            if (deleting !== id) { deleting = id; redraw(); return; }
            deleting = null;
            const wasOpen = id === st.slotId;
            await st.deletePlan(id);
            if (wasOpen) {
              const next = [...st.plans().plans].sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)))[0];
              if (!(next && await app.switchPlan(next.id))) { await st.addPlan(RF.seed.createGraveggenSeed()); app.afterPlanChange('Started again from the Gråveggen demo plan.'); }
            }
            redraw();
          }
        });
        list.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'plName') list.querySelector('[data-pact="saveName"]')?.click(); });
      } });
    if (res.value?.open) await app.switchPlan(res.value.open);
    else if (res.value?.add) app.newPlanDialog();
    else if (res.value?.file) (st.ui.mode === 'field' ? RF.modes.field?.loadPlanFile?.() : app.openProject());
  };

  // ---- colour scheme ----------------------------------------------------------------------------
  app.themeButtons = () => {
    const T = RF.theme, A0 = T.THEMES[0], D = T.THEMES.find(t => t.id === 'day');
    const half = (a, b) => `linear-gradient(135deg, ${a} 50%, ${b} 50%)`;
    return [T.AUTO, ...T.THEMES].map(t => {
      const auto = t.id === 'auto', on = T.choice === t.id;
      return `<button type="button" class="${on ? 'on' : ''}" data-theme-pick="${t.id}" aria-pressed="${on}">
        <span class="tp" style="background:${auto ? half(A0.ink, D.ink) : t.ink}"><em style="background:${auto ? half(A0.paper, D.paper) : t.paper}"></em><i style="background:${auto ? half(A0.accent, D.accent) : t.accent}"></i></span>
        <span class="main"><b>${U.esc(t.name)}</b><span>${U.esc(t.note)}</span></span></button>`;
    }).join('');
  };
  app.wireThemeButtons = root => root.querySelectorAll('[data-theme-pick]').forEach(b => b.addEventListener('click', () => {
    RF.theme.set(b.dataset.themePick);
    root.querySelectorAll('[data-theme-pick]').forEach(x => { const on = x.dataset.themePick === RF.theme.choice; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
  }));
  app.themeDialog = () => app.modal({ title: 'Colour scheme', wide: true,
    html: `<div class="themes">${app.themeButtons()}</div><p class="hint">Only changes how ROUTEFORM looks on this ${app.deviceName()}. Route and hold colours stay the same.</p>`,
    onOpen: box => app.wireThemeButtons(box) });

  function fileMenu(anchor) {
    const E = RF.exporters, ro = app.store.readOnly;
    app.menu(anchor, [
      { label: `Plans on this ${app.deviceName()}…`, run: app.plansDialog, disabled: ro },
      { label: 'Open a project file (.json, v0.2 or v0.1)…', run: app.openProject, disabled: ro },
      { label: 'Save project file (.json, includes photos)', run: app.saveProject },
      { label: 'Import on-wall progress from phone (.json)…', run: () => E.importProgress() },
      '-',
      { label: 'Export PNG wall overview', run: () => E.exportPng() },
      { label: 'Export SVG wall overview', run: () => E.exportSvg() },
      { label: 'Print-ready set sheets by height band (.html)', run: () => E.exportSetSheets() },
      { label: 'Field measurement worksheet (.csv)', run: () => E.exportMeasurementCsv() },
      '-',
      { label: 'Publish revision (freeze for phone)…', run: () => E.publishRevisionDialog(), disabled: ro },
      { label: `Other walls: new plan on ${RF.seed.walls.map(w => w.name).join(', ')}…`, run: app.newPlanDialog, disabled: ro },
      '-',
      { label: 'Colour scheme…', run: app.themeDialog },
      { label: 'About, limitations & keyboard shortcuts', run: about }
    ]);
  }
  // Start a new plan on one of the built-in walls (desktop File menu and the phone's More page).
  app.newPlanDialog = async () => {
    const st = app.store, walls = RF.seed.walls;
    const res = await app.modal({ title: 'New plan', html: `
      <p>Start a new, empty plan on one of these walls. The plan that's open now stays saved on this ${app.deviceName()} (find it again under <i>Plans on this ${app.deviceName()}</i>).</p>
      <div class="list">${walls.map(w => `<button type="button" class="li" data-wall="${U.esc(w.id)}"><span class="main"><b>${U.esc(w.name)}</b><span>${U.esc(w.summary)}</span></span></button>`).join('')}</div>`,
      buttons: [{ label: 'Cancel', value: null }],
      onOpen: (box, done) => box.querySelectorAll('[data-wall]').forEach(b => b.addEventListener('click', () => done(b.dataset.wall))) });
    const wall = walls.find(w => w.id === res.value);
    if (!wall || st.readOnly) return;
    const p = wall.create();
    p.projectId = U.uid('project');   // each new plan is its own project, even on the same wall
    app.climb?.close();
    await st.addPlan(p);
    app.afterPlanChange();
    app.toast(`New plan on ${wall.name}. The plan you had open is still saved. Its wall geometry is a placeholder, not measured.`, 'warn', 7000);
  };
  function about() {
    app.modal({ title: 'ROUTEFORM 0.2 — Vulkan routesetting planning aid', wide: true, html: `
      <p>A planning and communication aid for an experienced routesetter: one wall per plan (Gråveggen, or the Galleriet draft), concurrent routes, holds attached to mounting-hole identities, and a phone reference view.</p>
      <div class="callout bad">Not a safety, engineering, anchor, climbability or grading tool. It never approves protection, anchors or routes.</div>
      <h3>Keyboard (desktop)</h3>
      <dl class="kv"><dt>Ctrl+Z / Ctrl+Y</dt><dd>Undo / redo</dd><dt>P / Esc</dt><dd>Place tool / back to select</dd><dt>R / Shift+R</dt><dd>Rotate selected hold ±15°</dd>
      <dt>Arrow keys</dt><dd>Move selected bolt-on hold to the neighbouring hole (screw-on: 10 mm)</dd><dt>D</dt><dd>Duplicate selected hold</dd><dt>Delete</dt><dd>Remove selected hold</dd>
      <dt>1 / 2 / 3…</dt><dd>Make route 1/2/3 active</dd><dt>F</dt><dd>Fit sector</dd><dt>Wheel / pinch</dt><dd>Zoom at cursor; drag empty wall to pan; Shift+wheel pans sideways</dd></dl>
      <h3>Coordinates</h3><p>${U.esc(app.store.project.coordinateSystem.origin)}; X right, Y up, millimetres. ${U.esc(app.store.project.coordinateSystem.note)}</p>` });
  }

  // ---- keyboard ---------------------------------------------------------------------------
  function onKey(e) {
    const t = e.target;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || t.isContentEditable) return;
    if (document.querySelector('.modal-back')) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey) { e.preventDefault(); app.store.undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); app.store.redo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); app.saveProject(); return; }
    if (k === 'f' && !e.ctrlKey && !e.metaKey) { app.view.fitSector(); return; }
    if (!(k === ' ' && t.tagName === 'BUTTON') && app.climb?.onKey(e)) return;
    app.mode()?.onKey?.(e);
  }

  // ---- boot ---------------------------------------------------------------------------------
  async function loadInitialProject() {
    const st = app.store;
    const embedded = document.getElementById('rf-embedded-plan');
    if (embedded) {
      const res = S.validateProject(embedded.textContent);
      if (res.ok) { app.fieldOnly = true; st.readOnly = true; st.load(res.project, { noSave: true }); return 'embedded'; }
      app.toast('Embedded plan could not be read: ' + res.errors[0], 'bad', 9000);
    }
    const m = /^#plan=([\w.-]+)$/.exec(location.hash);
    if (m && location.protocol.startsWith('http')) {
      try {
        const r = await fetch('/api/plans/' + encodeURIComponent(m[1]));
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const res = S.validateProject(await r.text());
        if (!res.ok) throw new Error(res.errors[0]);
        app.fieldOnly = true; st.readOnly = true; st.load(res.project, { noSave: true }); st.saveLocal();
        return 'lan';
      } catch (e) {
        app.toast('Could not load the published plan (' + e.message + '). Showing the last plan stored on this device.', 'warn', 9000);
        const cached = await st.loadLocal('field-plan');
        const res = cached && S.validateProject(cached);
        if (res && res.ok) { app.fieldOnly = true; st.readOnly = true; st.load(res.project, { noSave: true }); return 'cache'; }
      }
    }
    // Plans on this device: open the one that was open last, else the most recently saved one.
    const ix = st.plans(), bySaved = [...ix.plans].sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
    for (const id of [...new Set([ix.current, ...bySaved.map(x => x.id)])].filter(Boolean)) {
      if ((await st.openPlan(id)).ok) return 'autosave';
    }
    if (ix.plans.length) app.toast('None of the plans stored on this device could be read; starting from the demo plan.', 'warn', 9000);
    else {
      // Up to 0.3.0 there was a single autosaved project; it becomes the first plan on the device.
      const legacy = await st.loadLocal('project'), res = legacy && S.validateProject(legacy);
      if (res?.ok) { await st.addPlan(res.project); return 'autosave'; }
      if (res) app.toast('The autosaved project could not be read; starting from the seed. (' + res.errors[0] + ')', 'warn', 9000);
    }
    await st.addPlan(RF.seed.createGraveggenSeed());
    return 'seed';
  }

  async function boot() {
    buildShell();
    const st = app.store;
    app.view = new RF.WallView($('wallCanvas'), app);
    const source = await loadInitialProject();
    let keepAsked = false;
    st.on((type, detail) => {
      if (type === 'change' || type === 'load') { app.renderPanels(); app.requestDraw(); }
      else if (type === 'photo') { app.view.warpCache.delete(detail); app.requestDraw(); app.mode()?.onPhoto?.(detail); }
      else if (type === 'warn') app.toast(detail, 'warn');
      else if (type === 'saved') {
        app.renderTop(); app.mode()?.onSaved?.(detail);
        if ((detail === 'failed' || detail === 'saved-no-photos') && app.saveWarned !== detail) {
          app.saveWarned = detail;
          app.toast(detail === 'failed' ? `Couldn't save on this ${app.deviceName()}: its storage is full or blocked. Save a file to keep your changes.`
            : `Saved on this ${app.deviceName()} without the photos (not enough space). Save a file to keep them.`, 'bad', 9000);
        }
      }
      else if (type === 'progress') { app.requestDraw(); app.mode()?.onProgress?.(); }
      // After the first edit, ask the browser to keep this site's storage (no prompt in Safari or Chrome).
      if (type === 'change' && !keepAsked && !st.readOnly) { keepAsked = true; navigator.storage?.persisted?.().then(k => k || navigator.storage.persist()).catch(() => {}); }
    });
    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => app.setMode(b.dataset.mode)));
    $('undoBtn').addEventListener('click', () => st.undo());
    $('redoBtn').addEventListener('click', () => st.redo());
    $('fileBtn').addEventListener('click', e => { e.stopPropagation(); fileMenu(e.currentTarget); });
    $('shareBtn').addEventListener('click', () => RF.exporters.sendToPhoneDialog());
    document.addEventListener('keydown', onKey);
    // iOS Safari ignores user-scalable=no: in the phone view a pinch on the sheet or bars would zoom the
    // whole page and break the layout. The wall map keeps its own pinch zoom (pointer events).
    // If the page is already zoomed in anyway, let the pinch through so it can be zoomed back out.
    const pageZoomed = () => (window.visualViewport?.scale || 1) > 1.01;
    for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, e => { if (document.body.classList.contains('field') && !pageZoomed()) e.preventDefault(); }, { passive: false });
    // After typing, snap a page that Safari zoomed into a text field back to normal size.
    const vp = document.querySelector('meta[name=viewport]'), vpContent = vp?.content || '';
    document.addEventListener('focusout', () => {
      if (!vp || !document.body.classList.contains('field') || !pageZoomed()) return;
      vp.content = vpContent + ', maximum-scale=1';
      setTimeout(() => { vp.content = vpContent; }, 400);
    });
    wireHud(); renderBands();
    new ResizeObserver(() => app.view.resize()).observe($('stage'));
    // Save a pending change straight away when the app goes to the background or closes: iPhones often
    // suspend or end a backgrounded page without warning.
    const flush = () => { st.flushSave(); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
    window.addEventListener('pagehide', flush);
    window.addEventListener('beforeunload', flush);

    const params = new URLSearchParams(location.search);
    let mode = app.fieldOnly || params.get('mode') === 'field' || window.innerWidth < 760 ? 'field' : (st.ui.mode || 'route');
    if (!app.modes[mode]) mode = 'route';
    st.ui.mode = null;
    app.setMode(mode);
    if (source === 'seed' && !app.fieldOnly) app.toast('Loaded the PRELIMINARY Gråveggen seed: geometry is illustrative, routes are demos.', 'warn', 7000);
    if (location.protocol.startsWith('http')) {
      fetch('/api/ping').then(r => (r.ok ? r.json() : null)).then(j => { if (j && j.app === 'routeform') { app.server = j; app.mode()?.onServer?.(); } }).catch(() => {});
    }
    // Sandboxed frames (e.g. a page embedded on another site) throw on navigator.serviceWorker.
    try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* no offline cache here */ }
    app.ready = true;
  }

  RF.boot = boot;
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  }
})(globalThis.RF = globalThis.RF || {});
</script>
</body>
</html>
